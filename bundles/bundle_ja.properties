block.asthosus-mechanical-joint.description = 多脚ユニットの製造に使用される関節パーツ。

#Status Effects

status.asthosus-13m-01-status-rejuvenated.name = 再生
status.asthosus-13m-01-status-rejuvenated.description = オアシス水に含まれる豊富なミネラルがこのユニットの装甲に作用している。移動速度が低下する代わりに、徐々に修復される。

status.asthosus-13m-02-status-radiated.name = 放射線
status.asthosus-13m-02-status-radiated.description = 付近の重晶石による強烈な放射線がこのユニットの回路を侵している。内部からゆっくりと破壊されていく。

status.asthosus-13m-03-status-infested.name = 寄生
status.asthosus-13m-03-status-infested.description = 微小なバライト生物がこのユニットの制御系を乗っ取っている。攻撃力、リロード速度、建造速度が低下する。

status.asthosus-13m-04-status-energy-phasing.name = エネルギー位相異常
status.asthosus-13m-04-status-energy-phasing.description = ユニットのエネルギー状態に位相異常が生じ、システムが麻痺している。移動および攻撃が不可能。

status.asthosus-13m-05-status-control-corruption.name = 制御破損
status.asthosus-13m-05-status-control-corruption.description = このユニットの移動制御装置が損傷している。リロード速度と移動速度が低下する。

status.asthosus-13m-06-small-speed-boost.name = 速度ブースト（小）

status.asthosus-13m-07-medium-speed-boost.name = 速度ブースト（中）

status.asthosus-13m-08-large-speed-boost.name = 速度ブースト（大）

