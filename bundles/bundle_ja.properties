block.asthosus-barite-interceptor.name = ハイヴインターセプター
block.asthosus-barite-interceptor.description = チャージ後、濃縮された液体重晶石の塊を放ち、ダメージと放射線状態を付与する。建造物に対して追加ダメージを与える。
block.asthosus-barite-slinger.name = ハイヴスリンガー
block.asthosus-barite-slinger.description = 体内で有機的な重晶石の巨礫を生成して敵に投げつけ、広範囲に高い範囲ダメージを与える。
block.asthosus-barite-tempest.name = ハイヴテンペスト
