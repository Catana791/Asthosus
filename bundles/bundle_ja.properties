#Custom Database
database-category.memorial-recordings = 記念記録
database-category.lore-tablets = 資源分析記録
database-tag.unitpart = ユニットパーツ

status.asthosus-25y-01-memorial-recording-1.name = 記念記録 - ジェネシス
status.asthosus-25y-01-memorial-recording-1.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-01-memorial-recording-1.details = かつてセルプロ太陽系には、広大な海を湛えた緑豊かな惑星が存在した。\n住人たちはその惑星を「アストス」と呼んでいた。\nそこには豊かな生命が息づいていた。\n\n強大な力と知識を持つ文明がその地を治めていた。\n人々はこの星で生まれ育った先住民であり、植民してきたわけではない。\n彼らの知る生命そのものが、アストスで誕生したのだ。

status.asthosus-25y-02-memorial-recording-2.name = 記念記録 - イグニッション
status.asthosus-25y-02-memorial-recording-2.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-02-memorial-recording-2.details = 強大な力と知識を誇りながらも、アストスの人々の科学技術は\n太陽系の他の惑星ほど進歩してはいなかった。\n惑星間航行を発明したのも、ごく最近のことだった。\n\n彼らに心配事はほとんどなかった。\n戦争も疫病もごく稀であった。\nアストス人に負担を強いる唯一の存在は太陽の熱であった。\nアストスが太陽に比較的近い軌道にあったためである。

status.asthosus-25y-03-memorial-recording-3.name = 記念記録 - ラティス
status.asthosus-25y-03-memorial-recording-3.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-03-memorial-recording-3.details = 惑星が絶えず直面していたもう一つの問題は、\n二つの政党による権力闘争だった。\n一方の「トルミル」は、技術の進歩こそが\n良きものをもたらすと信じていた。\n彼らはあらゆる分野の研究を推進しようとした。\n\nもう一方の「アルミス」は、アストスの暮らしは\n惑星間航行の発明以前の方が優れており、\n当時の状態へ戻すべきだと考えていた。

status.asthosus-25y-04-memorial-recording-4.name = 記念記録 - フルージ
status.asthosus-25y-04-memorial-recording-4.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-04-memorial-recording-4.details = 惑星間航行の発明から数年後、アストス人は\nテラフォーミングの実験に着手した。\n最初の実験はアストスの衛星トレカラで行われた。\nかつては大気もなく生命の存在しない天体であった。\n\nテラフォーミング計画は成功を収め、トレカラは\n緑豊かで生命に適した衛星へと変貌を遂げた。

status.asthosus-25y-05-memorial-recording-5.name = 記念記録 - イミスト
status.asthosus-25y-05-memorial-recording-5.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-05-memorial-recording-5.details = 太陽系およびアストスとその民の状態を監視するため、\nトレカラに前哨基地が築かれた。\nこの前哨基地ができて数年後、太陽の熱と放射線をいくらか逸らすための\n強力なフォース発生装置が設置された。\n\nさらに、太陽熱以外の脅威からも両星を結び守護するため、\nアストスとトレカラに2基の装置が設置された。

status.asthosus-25y-06-memorial-recording-6.name = 記念記録 - 火成岩の峰々
status.asthosus-25y-06-memorial-recording-6.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-06-memorial-recording-6.details = トレカラのテラフォーミングが大成功を収めたことで、\n拡大を続ける住民の勢いに乗じ、アストスの海の一つを\n居住可能な大地へと作り変える試みがなされた。\n\nこの実験の最中、\n太陽から太陽風の放出が噴き上がった。\n幸い、トレカラに設置されたフォース発生装置がその大部分を逸らし、\nさらなる被害を防いだ。少なくともアストス人はそう思っていた……

status.asthosus-25y-07-memorial-recording-7.name = 記念記録 - 荒廃の渓谷
status.asthosus-25y-07-memorial-recording-7.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-07-memorial-recording-7.details = 太陽フレアのエネルギーの大部分がフォースシールドをすり抜け、\nアストスとトレカラ双方のテラフォーミング装置を直撃したのだ。\n\n機械は暴走し、アストス文明の大半を滅ぼしかねない事態に陥った。\n\nしかし幸いなことに、最優秀の科学者たちが土壇場で\nテラフォーミング装置を宇宙空間へと打ち上げ、そこで爆破することで破局を回避した。\n\nだがこの惨事は、アルミス党が権力を掌握し、\nついにアストスを支配するための決定的な引き金となった。

status.asthosus-25y-08-memorial-recording-8.name = 記念記録 - デフリンジ
status.asthosus-25y-08-memorial-recording-8.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-08-memorial-recording-8.details = 数百年が過ぎ、アストスとトレカラはなお繁栄を続けていた。\nあの事件を目撃した人々の大半は、老衰やその他の理由で\nすでに世を去っていた。\n\nアルミスが実権を握ったことでトレカラの前哨基地は放棄され、\nアストスを守護していたフォースプロジェクターも機能しなくなった。

status.asthosus-25y-09-memorial-recording-9.name = 記念記録 - 合成施設
status.asthosus-25y-09-memorial-recording-9.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-09-memorial-recording-9.details = アルミスは、アストスとその民を脅かす者が現れた場合に備え、\n大量破壊兵器を確実に製造していた。\n\nある日、他の惑星の実験が引き金となり、\n太陽から壊滅的な磁気嵐が放出された。\n\n磁気嵐はまずトレカラを襲い、アストスを守るために\n稼働し続けていた最後のインフラ設備を停止させた。

status.asthosus-25y-10-memorial-recording-10.name = 記念記録 - 溶鉱炉の集落
status.asthosus-25y-10-memorial-recording-10.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-10-memorial-recording-10.details = 科学者たちはまずアストス地表の装置から始め、\nトレカラとアストスの装置を復旧しようと奔走した。\n\nしかし作業中に装置が破裂して大爆発を起こし、\n周辺の複数の大都市を巻き込んだ。さらに悪いことに、爆発は\n最強の大量破壊兵器を保管していた施設にも直撃した。\n\n爆発の熱、あるいは生物兵器から放たれたウイルスにより、\n何百万人もの市民が激しい苦痛のうちに命を落とした。

status.asthosus-25y-11-memorial-recording-11.name = 記念記録 - オメガ
status.asthosus-25y-11-memorial-recording-11.description = デジタル形式で記録された記念碑の碑文。
status.asthosus-25y-11-memorial-recording-11.details = この二度の甚大な災厄により、アストスの大気は\nほぼ完全に破壊された。\nその結果、アストスの気温は緩やかに、\nしかし絶え間なく上昇し続け、アストス人に止める術はなかった。\n\nやがてアストスを――より正確にはその民を救うための\nあらゆる試みは徒労に終わった。\n惑星の全人口は極度の高温によって死に絶えたのだ。\n\nアストスの運命は、こうして決したのである。

#Lore Tablets
#notes for biome name: Barrens(荒野), Desert & Oasis(砂漠 & オアシス), Mesa(メサ), Igneous Biome(火成岩), Radiant Expanse(輝光広原)

status.asthosus-26z-01-item-tablet-ferrinite.name = 資源記録 - フェリナイト
status.asthosus-26z-01-item-tablet-ferrinite.description = 産地：\n荒野。アストスの中でも比較的環境が安定したバイオームである。\nこの地域は広大な流砂の地面、亜炭鉱床、地熱噴気孔、そして枯死した植物の残骸によって特徴づけられる。\n危険がまったくないわけではないが、荒野は初期作業においてはるかに安全な環境を提供する。\n\n組成：\nフェリナイトは、砂と鉱物堆積物が自然に融合して形成された岩石状の物質である。\nアストスに存在する強烈な熱によって物質が緻密な石のような姿へと硬化しており、初期の建築に有用な資源となっている。
status.asthosus-26z-01-item-tablet-ferrinite.details = 項目 R-001：フェリナイト物質報告書\n\nフェリナイトは荒野で最も豊富に見つかる物質の一つである。乾燥して不毛な土地ではあるものの、荒野はアストスのより不安定で過酷な他の地域と比べて安定した環境を備えている。\n地熱噴気孔と亜炭鉱床の組み合わせにより、砂と鉱物が時間をかけて硬化・融合したこの岩石状物質が形成された。\nフェリナイトは硬度が低いため、より高度または長期的な建築には向かないが、拠点建設の初期段階においては計り知れない価値を持つ。\n豊富な埋蔵量と採掘の容易さにより、迅速な稼働体制の確立が可能となる。\n資源が充実し、より耐久性の高い素材が利用可能になるにつれてフェリナイトはより強固な代替材に置き換えられていくが、\nより複雑な構造物においても引き続き用途があるようだ。\n\n - トルミル資源分析報告書 No.1

status.asthosus-26z-02-item-tablet-demetite.name = 資源記録 - デメタイト
status.asthosus-26z-02-item-tablet-demetite.description = 産地：\n荒野。地熱噴気孔と鉱物豊富な堆積物がデメタイトの形成に理想的な条件を生み出しているアストスのバイオームである。\nしばしばフェリナイトと並んで発見され、この金属資源は同じ資源豊かな地域から採掘される。\n\n組成：\nデメタイトは圧力下で鉱物が自然に融合して形成された金属物質である。\n柔らかく金属的な性質により基本的な建築に適しているが、単体では高度な建築に耐えうる十分な耐久性を持たない。
status.asthosus-26z-02-item-tablet-demetite.details = 項目 R-002：デメタイト物質報告書\n\nデメタイトは荒野で見つかる金属資源の一つであり、建築に利用できる唯一の金属である。\nその金属的性質により有用な建材となるが、硬度が低いため高い負荷のかかる用途に単体で用いるには適さない。\n豊富で採掘も容易である一方、長期的なインフラ設備に必要な耐久性を欠いている。\n主として基本的な建築や単純な機械部品に用いられる。\n事業が拡大し、より強靭な素材が利用可能になればデメタイトは置き換えられていくが、初期の前哨基地や将来の構造物においてもその価値は失われない。\n\n - トルミル資源分析報告書 No.2

status.asthosus-26z-03-item-tablet-lignite.name = 資源記録 - 亜炭
status.asthosus-26z-03-item-tablet-lignite.description = 産地：\nアストスの荒野および砂漠地域で発見される。\n亜炭はかつて植物相が繁茂していた壁付近、とりわけ古代の有機物層が埋没し圧縮された場所に現れる。\n\n組成：\n亜炭は太古に枯死した植物質が部分的に分解して生じた、低品位の石炭状物質である。\n多孔質で脆い構造のため着火しやすく、加熱や基本的な燃焼に重宝される。
status.asthosus-26z-03-item-tablet-lignite.details = 項目 R-003：亜炭物質報告書\n\n亜炭は荒野と砂漠双方の比較的脆い地表の下、しばしばバイオームの壁面近くで発見される。\nアストスの植生はほぼ絶滅しているものの、亜炭の存在はかつて植物が栄えていた忘れ去られた時代を示唆している。\n長い歳月を経て、熱と圧力がこれらの残骸を脆く黒ずんだ燃料へと圧縮した。\nエネルギー出力は控えめだが、着火の容易さと比較的豊富な埋蔵量により、初期段階の加熱システムや燃焼装置において信頼できる資源となっている。\n不適切な取り扱いをすると可燃性によって事故を招く恐れがあるため、取り扱いには注意が推奨される。\nより過酷な環境へ事業が広がっても、亜炭はより高度な燃料技術への足掛かり、そして頼もしい希望の光であり続けている。\n\n - トルミル資源分析報告書 No.3

status.asthosus-26z-04-item-tablet-hardened-sand.name = 資源記録 - 硬化砂
status.asthosus-26z-04-item-tablet-hardened-sand.description = 産地：\n主にアストスの砂漠バイオームで発見される。\n硬化砂は、緩い堆積物が持続的な熱に晒され、経年により自然に圧縮された場所に形成される。\n\n組成：\n硬化砂は、通常の砂の堆積物や一般の沈積物が強い熱に晒された結果生じたものである。\nこの過程で砂粒が融合し、より緻密で引き締まった物質となる。\n石材や金属のような構造強度は持たないものの、簡易な建材の精製における有用な中間素材として機能する。
status.asthosus-26z-04-item-tablet-hardened-sand.details = 項目 R-004：硬化砂物質報告書\n\n初期の地表調査では見過ごされがちだが、硬化砂は極度の熱によって砂や堆積物が固形でありつつ加工可能な形態へと圧縮された地域に現れる。\n砂漠ではこのバイオームの地面の大半を構成しているため、非常に豊富に存在する。\n主要な建材と比べると用途は限られているものの、加工工程――特に他の資源の生成において極めて重要な役割を果たす。\n耐久性は並であり建造物の素材としての使用は推奨されないが、入手の容易さと精製工程における役割から、確保しておくべき価値のある資源である。\n\n - トルミル資源分析報告書 No.4

status.asthosus-26z-05-item-tablet-red-sand.name = 資源記録 - 赤砂
status.asthosus-26z-05-item-tablet-red-sand.description = 産地：\nアストスのメサバイオームでのみ発見される。\n赤砂はその鮮やかな色合いと粒状の質感によって容易に識別でき、この地域の急峻な段丘斜面や谷を覆っていることが多い。\n\n組成：\n赤砂は酸化した鉱物粒子と風化した堆積物から成り、様々な元素物質を微かに含んでいる。その色彩は高い鉄分含有量に由来し、熱と風に幾度となく晒される過程で酸化したものである。
status.asthosus-26z-05-item-tablet-red-sand.details = 項目 R-005：赤砂物質報告書\n\n赤砂は、長時間の高熱への曝露によってガラス状の物質と化したテラコッタや焦げた赤砂とともに、メサバイオームの大半を覆っている。\nそれ自体には構造的価値がほとんどないものの、詳細な分析により微量の希少元素が含まれていることが判明しており、二次精製工程で有用となる可能性がある。\nその役割は基幹資源というよりも兵站的な補助に近く、受動的な資源供給源としての側面が強い。\n優先度は比較的低いため、赤砂は通常、より広範な掘削作業の副産物として収集される。また、爆発性あるいは極めて可燃性の高い物質の混合剤としても価値があるようだ。\n\n - トルミル資源分析報告書 No.5

status.asthosus-26z-06-item-tablet-lodestone.name = 資源記録 - 磁鉄鉱
status.asthosus-26z-06-item-tablet-lodestone.description = 産地：\n荒野と砂漠から得られる基礎素材を用い、専用の混合施設で製造される。\nアストスには天然の磁性岩も存在するが、通常の手段では到達不可能なため、代わりに人工生産が必要となる。\n\n組成：\n緻密で磁気反応性を備えた化合物であり、高密度の鉱物と堆積物系素材を物理的に混合することで生成される。\n天然の磁鉄鉱に見られるほどの強い磁化には及ばないものの、この混合物は自動化システムや輸送に有用な導電性を備えた安定した構造を形成する。
status.asthosus-26z-06-item-tablet-lodestone.details = 項目 R-006：磁鉄鉱物質報告書\n\n惑星の地殻から直接採取される他の多くの資源とは異なり、磁鉄鉱は採掘ではなく単純な混合によって作られる人工素材である。\n硬化砂とフェリナイトを組み合わせることで、基本的な導電性と構造的完全性を備えたバランスの良い化合物が形成される。\n製法は単純であるものの、磁鉄鉱は自律ユニットや一部の高度な建造物の組み立てにおいて不可欠であることが証明されている。\n制御機構や構造バランスの維持における役割から、生産および物流インフラの要となっている。\n\n - トルミル資源分析報告書 No.6

status.asthosus-26z-07-item-tablet-lithium.name = 資源記録 - リチウム
status.asthosus-26z-07-item-tablet-lithium.description = 産地：\n採掘ではなく工業的な精製によって製造される。\nリチウムは粉砕機――亜炭とデメタイトを摩耗させて反応性元素を抽出・精製する施設で生産される。\n\n組成：\n高い帯電電位と化学的感受性を持つ、淡い色の柔らかい物質。\n可燃性の原料と金属物質から使用可能なリチウムへ変換する工程は高効率だが、可燃物を含むため厳重な監視が必要となる。
status.asthosus-26z-07-item-tablet-lithium.details = 項目 R-007：リチウム物質報告書\n\n磁鉄鉱と同様、リチウムは地形から直接採取するのではなく、管理された処理装置内で合成される。\n強い圧力と摩耗のもとで亜炭とデメタイトを共に粉砕することで、微量の反応性元素が分離され、安定して使用可能な形態へと再結合される。\nその結果得られるのは電気化学的に活性な柔らかい化合物であり、電子システム、エネルギー中継器、電力管理ノードに不可欠な存在となる。\n爆発リスクは低いものの、リチウムは依然として化学的感受性と帯電性を有しており、保管中の汚染や熱曝露を避けるため取り扱い手順を遵守する必要がある。\n\n - トルミル資源分析報告書 No.7

status.asthosus-26z-08-item-tablet-cretite.name = 資源記録 - クレタイト
status.asthosus-26z-08-item-tablet-cretite.description = 産地：\n亜炭、リチウム、赤砂を組み合わせる専用工業施設「クレタイトミキサー」で生産される。\nその結果生まれる揮発性の高い複合材料は、主に制御された爆破や、厳重な管理下での強力なエネルギー源として使用される。\n\n組成：クレタイトは亜炭、リチウム、赤砂から成る化学的に活性で極めて不安定な混合物である。\n制御された定常条件下でこれらの要素が相互作用することで、可燃性とわずかな爆発性を持ち、適切に制御すれば莫大な潜在エネルギーを発揮する化合物が生まれる。
status.asthosus-26z-08-item-tablet-cretite.details = 項目 R-008：クレタイト物質報告書\n\nアストスにある大半の物質とは異なり、クレタイトは意図的に揮発性を高めて作られている。\nクレタイトミキサーで亜炭、リチウム、赤砂を使って製造されるこの複合材料は、極めて可燃性が高く、わずかに爆発性も帯びている。\nその性質上、通常の建築には使用できないものの、より専門的な用途においては極めて価値が高い。\nその爆発力は制御された解体作業やエネルギー生成に有用だが、この物質の取り扱いや輸送には細心の注意を払わなければならない。\n偶発的な着火は壊滅的な結果を招きかねない。\n現時点ではその使用は極めて精密な作業のみに限定されており、拠点建設やユニット生産には不向きである。\n\n - トルミル資源分析報告書 No.8

status.asthosus-26z-09-item-tablet-crystalline-geode.name = 資源記録 - 結晶質ジオード
status.asthosus-26z-09-item-tablet-crystalline-geode.description = 産地：\n過酷な地形と溶融スラグの池が広がる火成岩バイオームの壁周辺の地表で発見される。\nこれらのジオードはこのバイオームの縁付近で見つかるため、採集と接近は危険を伴うと同時に大きな見返りがある。\n\n組成：\n厚いフェリナイト層に包まれた黒曜石の結晶が、これらのジオードを形成している。\n周囲の溶融スラグからの強烈な熱がこうした天然の保護層の形成を早めており、ジオードの採取を一層困難にしている。
status.asthosus-26z-09-item-tablet-crystalline-geode.details = 項目 R-009：結晶質ジオード物質報告書\n\n結晶質ジオードは火成岩バイオームの溶融スラグ湖付近でよく発見され、近隣の火山裂け目からの強烈な熱がその形成を促している。\nこれらのジオードは貴重な黒曜石の結晶から成り、厚いフェリナイトの層で厳重に覆われている。\n外側のフェリナイト殻は過酷な環境から結晶を保護する一方で、抽出を困難にしている。\n耐久性と強度に優れた極めて貴重な資源である内部の黒曜石を取り出すには、ジオードを粉砕する以外に方法はない。\n溶融スラグ付近という立地ゆえに採取は危険を伴い、アストス地表のどこよりもはるかに高温な周囲の熱による危険を回避するため、綿密な計画と適切な装備が求められる。\n\n - トルミル資源分析報告書 No.9

status.asthosus-26z-10-item-tablet-obsidian.name = 資源記録 - 黒曜石
status.asthosus-26z-10-item-tablet-obsidian.description = 産地：\n火成岩バイオームおよび溶融スラグが豊富な地域で発見される。\n黒曜石は直接採掘することはできず、ジオードの粉砕やスラグの冷却といった特殊な手法によって抽出される。\n\n組成：\n黒曜石は極度の高熱下で自然形成される火山ガラスである。その硬度と耐久性により、高度な建築や特殊装備の素材として重宝されている。
status.asthosus-26z-10-item-tablet-obsidian.details = 項目 R-010：黒曜石物質報告書\n\n黒曜石はアストスで見つかる中でも屈指の耐久性を誇る素材であり、その強度と汎用性から高度な建築において極めて高く評価されている。\n他の資源とは異なり、黒曜石は直接採掘することができず、結晶質ジオードを砕くか、スラグ湖や火山裂け目の溶融スラグを冷却することで入手しなければならない。\n冷却工程を経ることで固化した黒曜石が得られ、それを回収する形となる。\n火成岩バイオームには豊富に存在するものの、周囲の溶融スラグが輸送や設備に多大な危険と支障をもたらすため、黒曜石の獲得にはリスクが伴う。\nしかし一度手に入れれば、黒曜石は高度な構造物や技術の構築に欠かせない貴重な素材となる。\n\n - トルミル資源分析報告書 No.10

status.asthosus-26z-11-item-tablet-irradiated-lump.name = 資源記録 - 放射塊
status.asthosus-26z-11-item-tablet-irradiated-lump.description = 産地：\n自然放射線が環境全体に満ちている広大で危険なバイオーム、輝光広原で主に見つかる。\nこの地域の放射性物質は豊富に存在するものの、接触することは極めて危険である。\n\n組成：\n放射性鉱物である放射塊は、未加工の状態では実用的な価値を持たない。その高い放射能により適切な防護措置なしでの取り扱いは危険であり、建築や生産に直接使用することもできない。\n構造は多孔質で脆い。
status.asthosus-26z-11-item-tablet-irradiated-lump.details = 項目 R-011：放射塊物質報告書\n\n放射塊は、自然放射線が大地に浸透している広大かつ危険なバイオーム「輝光広原」で産出する鉱物である。\n耐久性と放射性を備えているにもかかわらず、この塊は原鉱のままではほぼ使い道がない。その高い放射能は、採取や処理を試みるあらゆる者にとって重大な脅威となる。\nしかし、適切な管理と加工を施せば、安定して価値ある素材「重晶石」へと変換することができる。\n輝光広原は広大な放射性土壌と露出した鉱脈で知られているが、その危険性ゆえにあらゆる採掘作業において慎重さと綿密な計画が求められる場所である。\n\n - トルミル資源分析報告書 No.11

status.asthosus-26z-12-item-tablet-barite.name = 資源記録 - 重晶石
status.asthosus-26z-12-item-tablet-barite.description = 産地：\n主に輝光広原で見つかるこの鉱物は、その危険な性質を扱うために設計された専用施設で放射塊を精製した産物である。\n\n組成：\n重晶石は高ティアの建築、発電、および加工において多様な用途を持つ高放射性鉱物である。\nより高度な技術や構造物を築く上で重要な役割を果たす、高密度で耐久性に優れた資源である。\nこの鉱物は強い放射能で知られており、用途によっては危険にも資産にもなり得る。
status.asthosus-26z-12-item-tablet-barite.details = 項目 R-012：重晶石物質報告書\n\n重晶石は輝光広原で得られる最も価値の高い物質の一つである。\n放射塊から作り出されるこの資源は、高度な施設への電力供給、高ティアのコンポーネント生産、そして特殊加工に不可欠である。\nその放射性特性は莫大なエネルギーポテンシャルをもたらし、発電において欠かすことのできない素材となっている。\nその有用性の一方で、重晶石の高い放射能は取り扱いや保管に課題をもたらす。被曝は深刻な健康被害につながり得るため、放射線出力の慎重な管理が極めて重要である。\nその耐久性とエネルギーポテンシャルにより、重晶石はハイテク建造物や先進エネルギーシステムの構築に広く活用される見込みである。\n\n - トルミル資源分析報告書 No.12

status.asthosus-26z-13-item-tablet-crosium.name = 資源記録 - クロシウム
status.asthosus-26z-13-item-tablet-crosium.description = 産地：\nクロシウムは「クロシウム含浸機」と呼ばれる専用施設で作られ、管理された条件下で黒曜石、圧気、精製オアシス水が組み合わされる。\nこの独自の工程により、高度な建築やユニット製造で高く評価される特性を帯びる。\n\n組成：\nクロシウムは取り扱い工程に応じて電気的絶縁体と導電体の性質を切り替えられるという、驚くべき能力を持つ多用途素材である。\nその分子構造が類まれな適応性を与えており、複雑な建築システムから特殊ユニットや機械の製造に至るまで、ハイテク分野に不可欠な存在となっている。
status.asthosus-26z-13-item-tablet-crosium.details = 項目 R-013：クロシウム物質報告書\n\nクロシウムはアストスで発見された中でも最も興味深く、有用な物質の一つである。\nクロシウム含浸機で生成され、黒曜石、高圧の圧気、そして精製オアシス水を組み合わせることで、特異な性質を備えた複合材料が形成される。\nクロシウムの真価は、加工方法次第で電気的絶縁性と導電性の双方を示せる点にある。この二重機能により、クロシウムは特殊な電気的特性を要する構造物を中心に、高度な建築において計り知れない価値を持つ。\nまた、電流制御と絶縁の両立が不可欠なハイテク設計の特殊ユニット生産にも使用される。\nクロシウム自体は比較的安定しているものの、生成工程では精密な条件管理が求められるため、極めて有用でありながら慎重な管理を要する資源となっている。\n\n - トルミル資源分析報告書 No.13

status.asthosus-26z-14-item-tablet-vesmonium.name = 資源記録 - ヴェスモニウム
status.asthosus-26z-14-item-tablet-vesmonium.description = 産地：\nヴェスモニウムは「ヴェスモニウム織成機」で生産され、管理された条件下で亜炭、重晶石、圧気、液体重晶石を組み合わせて作られる。\nこの独自の混合により、わずかな帯電性、可燃性、そして放射性を帯びた素材が生まれ、高度な建築や防衛施設、加工に広く用いられる。\n\n組成：\nヴェスモニウムは揮発性物質の混合を伴う複雑な工程を経て形成される、極めて反応性の高い物質である。\nわずかな電荷、可燃性、そして中程度の放射能により、ハイテク用途の重要資源であると同時に、管理に危険を伴う物質となっている。
status.asthosus-26z-14-item-tablet-vesmonium.details = 項目 R-014：ヴェスモニウム物質報告書\n\nヴェスモニウムは亜炭、重晶石、圧気、液体重晶石を組み合わせてヴェスモニウム織成機で生成される合成物質である。得られる生成物は電荷、可燃性、放射能の繊細なバランスを示し、高度な建築、防衛システム、高エネルギー用途において特に有用となる。\nわずかな電荷を生み出す能力と固有の可燃性は、エネルギーシステムや防衛施設、爆発物の製造に新たな可能性をもたらす。\nしかしこれらの特性は同時に重大なリスクも孕んでおり、あらゆる技術にヴェスモニウムを組み込む際には慎重な取り扱いが不可欠となる。その放射能と揮発性のため、生活圏の近くで使用する際は特に注意して扱うべき物質である。\n\n - トルミル資源分析報告書 No.14

status.asthosus-26z-15-item-tablet-draysten.name = 資源記録 - ドレイステン
status.asthosus-26z-15-item-tablet-draysten.description = 産地：\nドレイステンは「ドレイステン溶融炉」で製造される。ヴェスモニウム、ノントラゲン、熱を組み合わせてこの先進合金を生み出すハイテク施設である。\n製造工程の複雑さ、特に材料として多大な資源を要するヴェスモニウムを必要とする点から、ドレイステンは極めて高価な素材となっている。\n\n組成：ドレイステンは極度の熱を用いてヴェスモニウムにノントラゲンを溶かし込むことで形成される、わずかに帯電し極めて可燃性の高い合金である。\n得られた素材は電荷、爆発性、中程度の放射能を強力に併せ持ち、終盤の建築やユニット製造における理想的な素材となっている。
status.asthosus-26z-15-item-tablet-draysten.details = 項目 R-015：ドレイステン物質報告書\n\nドレイステンはアストスにおける合金製造技術の頂点を象徴する存在である。この極めて高度な素材はドレイステン溶融炉で生産され、複数の揮発性成分を要する複雑な物質であるヴェスモニウムに、ノントラゲンと熱を組み合わせて作られる。\n得られた合金はより強い電荷、可燃性、爆発性を誇り、終盤のインフラ設備や特殊ユニットに不可欠なものとなっている。\nしかしその製造には膨大な資源が必要であり、すでに多大な資源投資と生産設備を要するヴェスモニウムを必要とすることが、工程のコストと複雑さをさらに押し上げている。\nドレイステンの爆発ポテンシャルと帯電能力は、強力な防衛施設や先進ユニット、兵器の製造に最適である。\n\n - トルミル資源分析報告書 No.15

status.asthosus-26z-16-liquid-tablet-pressure.name = 資源記録 - 圧気
status.asthosus-26z-16-liquid-tablet-pressure.description = 産地：\n圧気はアストス全土で最も重要かつ広く使われる資源の一つであり、生活や作業に不可欠な数多くの機械、発電機、その他の装置に動力を供給している。\n地下深くの天然埋蔵層で見つかるか専用設備で抽出され、無数の稼働現場における生命線となっている。\n\n組成：\n圧気自体は極限状態下の気体物質であり、制御された環境下で解放される際に生じるエネルギー生成能力を活用・利用している。\n多くのアストス機械やタービン、エネルギーシステムの基本要素であり、高圧容器に貯蔵されたり、技術稼働のリアルタイム工程に用いられたりする。\n不適切な管理下では破滅的な爆発を起こす恐れがあるものの、アストス工業に不可欠な一部であり続けている。
status.asthosus-26z-16-liquid-tablet-pressure.details = 項目 R-016：圧気利用報告書\n\n圧気は単なる必須資源にとどまらず、アストスの技術インフラの大部分を駆動する原動力そのものである。\nタービンから大規模エネルギー生産システムに至るまで、圧気はこの惑星の大気や地下の不安定な環境からエネルギーを引き出す上で極めて重要な役割を担っている。\n気体であるため、格納状態のわずかな変動でさえ壊滅的な爆発につながりかねず、慎重な管理、貯蔵、取り扱いが求められる。可燃性は一切ないものの、爆発の危険性は深刻な懸念事項であり、使用されるあらゆる環境で高度な安全手順が必要となる。\nこのガスは圧気タービンの動力源として特に貴重であり、アストスで最も過酷なバイオームにおいてさえ効率的な発電を可能にする。\n極めて不安定でありながら、機械稼働におけるその有用性は計り知れない。適切な取り扱いによってこそ、圧気は技術的優位を維持する上で最も重要な物質の一つであり続けるのだ。\n\n - トルミル資源分析報告書 No.16

status.asthosus-26z-17-liquid-tablet-sif4.name = 資源記録 - 四フッ化ケイ素
status.asthosus-26z-17-liquid-tablet-sif4.description = 産地：\n四フッ化ケイ素は極めて揮発性の高いガスであり、危険ではあるものの、アストスの様々な先進システム――とりわけ兵器の冷却機構や資源精製工程において不可欠な構成要素となっている。\n主に研究施設や工業施設で見られ、特定の高エネルギーシステムの効率と安全性を維持する上で重要な役割を果たす。\nこのガス自体は、アストスの噴気孔から地熱ガス収集機によって採取される。\n\n組成：\n四フッ化ケイ素は水や湿気と激しく反応する気体化合物であり、取り扱いを誤れば深刻な被害を引き起こし得る。毒性を持つ一方で、砲塔や特定の資源精製技術の冷却工程において不可欠な役割を果たしており、その性質により熱を効率よく吸収・発散することができる。\nその危険性は反応性の高さだけでなく、高温や不適切な格納状態に晒された際の爆発の危険性にもある。
status.asthosus-26z-17-liquid-tablet-sif4.details = 項目 R-017：四フッ化ケイ素取り扱い手順書\n\n四フッ化ケイ素は、その極端な揮発性と危険性ゆえに、今なお管理が最も困難な物質の一つである。\n砲塔や精製施設といった高エネルギー装置の冷却システムで広く使用されており、安全な温度を維持する上でかけがえのない役割を果たしている。熱抵抗を最小限に抑えて熱を吸収するこのガスの能力はこれらの用途に理想的だが、極めて反応性の高い組成であるため、微量の湿気への曝露や不適切な格納であっても壊滅的な結果を招きかねない。\nさらに、圧力下での爆発傾向も常に考慮しなければならない。そのため、使用にあたっては特別に設計された設備と強化された安全手順のみが許可されている。こうしたリスクがありながらも、高度な資源処理と砲塔運用において最も不可欠な化合物の一つであり続けている。\n\n - トルミル資源分析報告書 No.17

status.asthosus-26z-18-liquid-tablet-oasis-water.name = 資源記録 - オアシス水
status.asthosus-26z-18-liquid-tablet-oasis-water.description = 産地：\nオアシス水は、アストスの砂漠バイオーム内に点在するオアシスから採取される希少かつ不可欠な液体である。\n点々とわずかにしか存在しないこれらのオアシスは、そうでなければ乾燥して過酷な風景の中で唯一の重要な天然貯水池となっている。\n\n組成：\nオアシス水は異常に高いミネラル濃度によって特徴づけられ、通常の水とは異なる独自の性質を持つ。この高いミネラル含有量により沸点が上昇し、アストスの極端な高温下でも即座に蒸発するのを防いでいる。\nそのため、通常の水では蒸発が速すぎて使い物にならない環境において、冷却剤としての使用に極めて重要となる。\nまた、このミネラル濃度は非常に優れた熱伝導体としても機能し、一般的な液体よりもはるかに効率よく熱を吸収・放散することができる。
status.asthosus-26z-18-liquid-tablet-oasis-water.details = 項目 R-018：オアシス水使用報告書\n\nオアシス水の高いミネラル含有量こそが通常の水と一線を画す点であり、アストス上の冷却システムにとって不可欠な存在としている。独自のミネラル配合により、即座に蒸発することなく惑星の灼熱に耐えることができ、それが工業作業における冷却剤としての有用性の鍵となっている。\nこの組成のおかげで沸点に達するまでに大量の熱を吸収でき、特に気温が極限に達する砂漠地域において、発電設備や機械の冷却に極めて高い効果を発揮する。\nしかし、オアシス水の希少性ゆえにその利用は繊細なバランスを要し、この貴重な資源の枯渇を防ぐため持続可能な形での汲み上げが求められる。\n\n - トルミル資源分析報告書 No.18

status.asthosus-26z-19-liquid-tablet-purified-water.name = 資源記録 - 精製オアシス水
status.asthosus-26z-19-liquid-tablet-purified-water.description = 産地：\n精製オアシス水は、アストスの砂漠バイオームにあるミネラル豊富なオアシス水に由来する。汲み上げられた後、あらゆる汚染物質を取り除く濾過工程を経ることで、最高品質の液体だけが残される。\n\n組成：\n精製オアシス水は、専用の濾過機を用いてオアシス水を丁寧に濾過した結果得られたものである。この濾過工程により不純物が除去され、技術的用途に理想的な清浄な状態に保たれる。\n高いミネラル濃度を保ったまま、精製オアシス水には生のオアシス水に含まれていた天然の汚染物質が含まれていない。この改良された組成により優れた冷却剤としての性能が向上し、より高い純度が求められる精密機械や先進システムにおいていっそう効果を発揮する。
status.asthosus-26z-19-liquid-tablet-purified-water.details = 項目 R-019：精製オアシス水応用報告書\n\n精製オアシス水は、高度な機械やハイテク用途での使用における厳しい要件を満たすべく濾過された貴重な資源である。汚染物質を取り除いたミネラル豊富な組成は、上昇した沸点や優れた吸熱特性など、通常のオアシス水と同様の熱的利点を提供する。\nこの水の純度の高さは、反応炉やタービンの冷却システムなど、微量の不純物さえ故障につながり得る繊細で精密な機械にとって理想的である。\n純度が向上したとはいえ、精製オアシス水は濾過前と同様に希少であるため、あらゆる運用において慎重な管理が不可欠である。\n\n - トルミル資源分析報告書 No.19

status.asthosus-26z-20-liquid-tablet-liquid-barite.name = 資源記録 - 液体重晶石
status.asthosus-26z-20-liquid-tablet-liquid-barite.description = 産地：\n液体重晶石は極めて不安定で放射性を持つ液状の重晶石であり、最も過酷な環境下でのみ見つかる。\nこの流体形態は急速に拡散し、触れたあらゆるものにダメージを与える能力を持つ。その腐食性と放出する放射線により、アストスで最も危険な液体の一つとなっている。\nしかし、重晶石急冷プラントで冷却・処理することで、液体重晶石を固体の重晶石へと戻し、高度な建築や加工に有用な素材として活用できる。\n\n組成：\n液体重晶石は固体時の特性の多くを保持しているが、より不安定な液状となっている。\n高い放射能により取り扱いは極めて危険であり、微弱ながらも絶え間ない放射線場を放出し続けている。液体重晶石に触れたものはすべてこの放射線に晒され、結果としてダメージを受ける。\nその高い粘度と爆発性により、大量に存在する場合は潜在的な危険物となる。
status.asthosus-26z-20-liquid-tablet-liquid-barite.details = 項目 R-020：液体重晶石危険性報告書\n\n液体重晶石は、その高い不安定性と放出する放射線により、設備に対して重大な脅威をもたらす。\n適切に格納されない場合、環境全体に広がって甚大な被害を引き起こす。制御が困難な物質だが、適切な冷却工程を用いれば再び重晶石へと固化させ、高度な建築や防衛システムの資源として利用できる。\nただし、液体重晶石を安全に取り扱うには、使用可能な状態へと変換するために不可欠な重晶石急冷プラントなどの専用設備が必要となる。\n\n - トルミル資源分析報告書 No.20

status.asthosus-26z-21-liquid-tablet-nontragen.name = 資源記録 - ノントラゲン
status.asthosus-26z-21-liquid-tablet-nontragen.description = 産地：\nノントラゲンは、オアシス水と粉末状黒曜石を加圧するという独自の工程によって生産される、洗練された特殊ガスである。\nこのガスはアストスの先進冷却システムおよびハイテク生産工程において極めて重要な役割を果たす。その独自の特性は高効率な用途、とりわけ極端な温度が課題となる環境下で計り知れない価値を持つ。\nノントラゲンは熱安定性に優れていることで知られており、一定に制御された温度を要するシステムにおいて強力な冷却剤として機能する。\n\n組成：\nノントラゲンは特有の熱的特性を備えたガスであり、惑星上の先進機械や施設が発生させる熱の管理において重要な構成要素となっている。\n強い圧力下でオアシス水と粉末状黒曜石を結合させる合成工程により、驚異的な熱容量と安定した冷却効果を持つガスが生み出される。高温に耐え、そうでなければ過熱しやすいシステム内の冷却を安定して維持することができる。\n独自の原料配合により、ノントラゲンには微かながらも識別可能な色と質感が備わっており、これが取り扱い時の目印となっている。
status.asthosus-26z-21-liquid-tablet-nontragen.details = 項目 R-021：ノントラゲン合成報告書\n\nノントラゲンの合成は繊細な工程であり、温度と圧力の精密な制御を要する。\nハイエンドの生産システム、とりわけ極度の高熱が絶え間ない脅威となる輝光広原や火成岩バイオームのような環境におけるその有用性は計り知れない。\nこのガスは極めて効果的な冷却剤として機能し、特に高負荷条件下で継続的な冷却を要する先進機械や反応炉において重宝される。さらに、先進的な生産手法、特にハイテク合金や先端素材の製造においてノントラゲンが果たす役割は、どれほど強調してもし過ぎることはない。\n\n - トルミル資源分析報告書 No.21

#Units - Mechs

unit.asthosus-14n-01-shiv.name = シヴ
unit.asthosus-14n-01-shiv.description = 近距離の標的に向けて電気エネルギーの刃を放つ。一定間隔で短距離をダッシュできる。集団では強力だが、少数では脆い。

unit.asthosus-14n-02-bayonet.name = バヨネット
unit.asthosus-14n-02-bayonet.description = 近距離の標的に向けて分裂砲弾を発射する。ミサイルランチャーを装備。

unit.asthosus-14n-03-cleaver.name = クリーバー
unit.asthosus-14n-03-cleaver.description = ガトリング砲で敵の標的を掃射する。電磁地雷ランチャーを装備。

unit.asthosus-14n-04-apex.name = エイペックス
unit.asthosus-14n-04-apex.description = 敵の標的に向けてハープーンとフラックの連射を浴びせる。

unit.asthosus-14n-05-crest.name = クレスト
unit.asthosus-14n-05-crest.description = 帯電物質の連続流を放つ。定期的に周囲を旋回する塊を召喚し、付近の敵ユニットや建造物を追尾させる。さらに、飛来する攻撃を防ぐアークバリアを展開できる。

#Units - Tanks

unit.asthosus-15o-01-shennong.name = シェンノン
unit.asthosus-15o-01-shennong.description = 敵に向けて電撃エネルギービームを放つ。

unit.asthosus-15o-02-trigon.name = トリゴン
unit.asthosus-15o-02-trigon.description = 俊敏で耐久力が高い。ロケットランチャーを装備。

unit.asthosus-15o-03-aprotodon.name = アプロトドン
unit.asthosus-15o-03-aprotodon.description = 俊敏で耐久力が高い。ビームレールガンを装備。

unit.asthosus-15o-04-aphelops.name = アフェロプス
unit.asthosus-15o-04-aphelops.description = 破壊的なフラクタルキャノンに加え、サブマシンガンおよび電磁ランチャーを装備している。

unit.asthosus-15o-05-annectodon.name = アネクトドン
unit.asthosus-15o-05-annectodon.description = 強力なディスラプターキャノンを装備。敵の大群を殲滅することに秀でている。

#Units - Hover

unit.asthosus-16a-01-parave.name = パレイヴ
unit.asthosus-16a-01-parave.description = 敵に向けて追尾ミサイルを発射する。地形を越えて移動することはできない。

unit.asthosus-16a-02-teraze.name = テレイズ
unit.asthosus-16a-02-teraze.description = 敵に向けて追尾砲弾を発射する。地形を越えて移動することはできない。

unit.asthosus-16a-03-decredence.name = デクレデンス
unit.asthosus-16a-03-decredence.description = 敵に向けて追尾砲弾とミサイルを発射する。地形を越えて移動することはできない。

unit.asthosus-16a-04-tequant.name = テクアント
unit.asthosus-16a-04-tequant.description = 敵に向けて低速・高威力の電撃球と小型ミサイルを発射する。地形を越えて移動することはできない。

unit.asthosus-16a-05-everse.name = エヴァース
unit.asthosus-16a-05-everse.description = 敵に向けて破壊的なレールガン弾の連射とミサイルを発射する。地形を越えて移動することはできない。

#Units - Support

unit.asthosus-16p-01-luminary.name = ルミナリー
unit.asthosus-16p-01-luminary.description = 建造および損傷した建造物の自動修復が可能。小型の修復ビームを装備。

unit.asthosus-16p-02-enlighten.name = エンライトン
unit.asthosus-16p-02-enlighten.description = 建造および損傷した建造物の自動修復が可能。他のユニットの建造を支援する。修復ビームとアークキャノンを装備。

unit.asthosus-16p-03-illuminate.name = イルミネイト
unit.asthosus-16p-03-illuminate.description = 建造および損傷した建造物の自動修復が可能。他のユニットの建造を支援する。砲撃砲と修復キャノンを装備。

unit.asthosus-16p-04-elucidate.name = エルーシデイト
unit.asthosus-16p-04-elucidate.description = 建造および損傷した建造物の自動修復が可能。連装砲撃砲と修復キャノンを装備。付近の味方ユニットを守るバリアを投影する。

unit.asthosus-16p-05-expound.name = エクスパウンド
unit.asthosus-16p-05-expound.description = 建造および損傷した建造物の自動修復が可能。二連装修復ランチャー、貫通修復レーザーアレイ、および2基のミサイルランチャーを装備。

#Units - Core - Spiders

unit.asthosus-17q-01-zeta.name = ゼータ
unit.asthosus-17q-01-zeta.description = コア：エッセンスを防衛する。建造物の建設と鉱石の採掘を行う。

unit.asthosus-17q-02-theta.name = シータ
unit.asthosus-17q-02-theta.description = コア：サブストラタムを防衛する。建造物の建設と鉱石の採掘を行う。

unit.asthosus-17q-03-iota.name = イオタ
unit.asthosus-17q-03-iota.description = コア：オンファロスを防衛する。建造物の建設と鉱石の採掘を行う。

#Units - Core - Worms

unit.asthosus-17q-04-erpode.name = エルポード
unit.asthosus-17q-04-erpode.description = コア：ペトラを防衛する。攻撃能力はないが、建造、採掘、および支援が可能。

unit.asthosus-17q-05-hirude.name = ヒルード
unit.asthosus-17q-05-hirude.description = コア：シレックスを防衛する。攻撃能力はないが、建造、採掘、および支援が可能。

unit.asthosus-17q-06-clitelle.name = クリテル
unit.asthosus-17q-06-clitelle.description = コア：サミットを防衛する。攻撃能力はごくわずかだが、建造、採掘、および支援が可能。

#Unit - Mounting Drone
unit.asthosus-18r-01-alveus.name = アルヴェウス
unit.asthosus-18r-01-alveus.description = 発着ステーションから投下ポイントへアイテムを輸送するために使用される。
unit.asthosus-18r-12-mounting-drone.name = マウンティングドローン
unit.asthosus-18r-12-mounting-drone.description = 組立ベイでのユニット組み立てを行う。

#Units - Arcana

unit.asthosus-arcana-blob.name = アルカナブロブ
unit.asthosus-arcana-blob.description = プライマルモノリスによって生み出されたこのエイリアン生物は、紫色の炎を吐いて攻撃する。

unit.asthosus-arcana-moth.name = アルカナモス
unit.asthosus-arcana-moth.description = アンプルモノリスによって生み出されたこのエイリアン生物は、防衛施設の上にアルカナ苔の塊を投下する。

unit.asthosus-arcana-raynoid.name = アルカナレイノイド
unit.asthosus-arcana-raynoid.description = 重厚な装甲を纏い、危険な攻撃能力を備えたカニに似た生物。

#Units - Barite

unit.asthosus-barite-crawler.name = バライトクローラー
unit.asthosus-barite-crawler.description = アストスの放射性バイオームで誕生した奇妙な生命体。

unit.asthosus-barite-stalker.name = バライトストーカー
unit.asthosus-barite-stalker.description = アストスの放射性バイオームで誕生した奇妙な生命体。

unit.asthosus-barite-scourge.name = バライトスカージ
unit.asthosus-barite-scourge.description = アストスの放射性バイオームで誕生した奇妙な生命体。

unit.asthosus-barite-elder.name = バライトエルダー
unit.asthosus-barite-elder.description = アストスの放射性バイオームで誕生した奇妙な生命体。これら生物の進化の頂点に位置する存在とみられる。

#Sectors - Campaign

sector.asthosus-19s-01-genesis.name = ジェネシス
sector.asthosus-19s-01-genesis.description = あなたはアストスへと降下し、生命も資源も乏しい小さな渓谷に降り立った。\nこの惑星を本当に征服することができるだろうか？

sector.asthosus-19s-02-ignition.name = イグニッション
sector.asthosus-19s-02-ignition.description = 地熱活動によって小規模な [accent]亜炭[] の鉱床が形成されている。\n\n電力の活用へと踏み出そう。

sector.asthosus-19s-03-lattice.name = ラティス
sector.asthosus-19s-03-lattice.description = 資源を宿した岩塊がこの地域一帯に点在している。\n敵に利用される前に確保せよ。\n迅速に勢力を拡大せよ。\nより強力な敵に備え、[accent]磁鉄鉱[] を活用して防衛を固めよう。

sector.asthosus-19s-04-fulge.name = フルージ
sector.asthosus-19s-04-fulge.description = あなたは狭いセクターに降下した。\n[accent]リチウム[] を研究して活用する絶好の機会だ。\n\n[accent]リチウム[] の生産体制を整え、このセクターの敵を打ち倒せ。\n\nここでは強力な磁気嵐が猛威を振るっている。\n味方と敵の双方に影響を及ぼしているようだ。\n\n\n[blue]補正：\n - 敵の攻撃力 +10%\n - 敵の耐久力 +25%\n - 味方建造物の耐久力 -15%

sector.asthosus-19s-05-immist.name = イミスト
sector.asthosus-19s-05-immist.description = 敵は荒涼とした地域の内部に拠点を築き上げている。\n\n着陸と同時に敵は攻撃を仕掛けてくるだろう。\n敵の砲火からコアを防衛せよ。\n\nユニット生産技術を研究せよ。\n敵の橋頭堡を排除せよ。

sector.asthosus-19s-06-igneous-peaks.name = 火成岩の峰々
sector.asthosus-19s-06-igneous-peaks.description = このセクターには高温のバイオームが含まれている。\nそこには新たな資源 [accent]黒曜石[] が存在する。\n\n[accent]黒曜石[] を生産し、それを用いてこのセクターのガーディアンを撃破せよ。

sector.asthosus-19s-07-detriment-valley.name = 荒廃の渓谷
sector.asthosus-19s-07-detriment-valley.description = 幾度もの爆撃を生き延びてきたセクター。\n敵はここに強大な戦力を集結させている。\n\n[accent]重晶石[] の生産に乗り出せ。\n\nより強固な防衛網を構築せよ。\nこのセクターの敵を押し返せ。\n\n\n[blue]補正：\n - 敵の耐久力 +15%\n - 敵の攻撃力 +15%\n - 敵の移動速度 +10%

#Warning: Called Defringe in English!!!
sector.asthosus-19s-08-defringed-webbery.name = デフリンジ
sector.asthosus-19s-08-defringed-webbery.description = 数千年間稼働を停止していた古い生産複合施設がここにある。\n自己修復機能を再起動させよ。防衛には [accent]ヴェスモニウム[] を活用せよ。\n\nウェーブ間隔の長さに油断してはならない。ここは敵にとって重要拠点なのだ。\n\n度重なる攻略失敗の末に残された古い残骸を活用せよ。\nこのセクターを守護する強力なガーディアンを打ち倒せ。\n\n\n[blue]補正：\n - 敵に速度ブーストが付与される。\n - 太陽熱発電パネルは使用不可。\n - 廃墟建造物の解体時に得られる資源が減少する。

sector.asthosus-19s-09-synthesis-facility.name = 合成施設
sector.asthosus-19s-09-synthesis-facility.description = 敵は二方向から同時に迫っている。\n\n[accent]クロシウム[] の生成に着手せよ。\nこの難関セクターを防衛し、占領せよ。

sector.asthosus-19s-10-furnace-settlement.name = 溶鉱炉の集落
sector.asthosus-19s-10-furnace-settlement.description = 敵はここに極めて強力な基地を築き上げている。\n\nさらに、敵は2つの降下地点から同時に部隊を展開してくる。\n敵軍屈指のガーディアンたちが、あなたの進軍を阻止するよう命じられている。\n\n[accent]ドレイステン[] の生成に着手せよ。\n敵ウェーブを撃退し、巨大な敵基地を破壊せよ。

sector.asthosus-19s-11-omega.name = オメガ
sector.asthosus-19s-11-omega.description = 最後の決戦の地、最果ての前線。\n\n敵は残存戦力をすべて集結させ、容赦なく攻撃を仕掛けてくる。\n\n複数の前線から同時に応戦する覚悟をせよ。\n\n敵は巨大な基地で降下地点を防衛している。\n\nこの基地を陥落させよ。\n攻撃を仕掛ける前に、まず自陣の領域と\n生産体制を固めておくのが得策かもしれない。

#Sectors - Optional

sector.asthosus-20t-01-maar.name = マール
sector.asthosus-20t-01-maar.description = 豊富な [accent]オアシス水[] を有する狭小なセクターに降り立った。\n\nこのセクターは [accent]磁鉄鉱[] の生産に最適である。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-02-chasm.name = キャズム
sector.asthosus-20t-02-chasm.description = このセクターは追加の [accent]リチウム[] 生産に役立つだろう。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-02-e-clamor.name = クラマー
sector.asthosus-20t-02-e-clamor.description = このセクターは資源が豊富なようだ。\n\nアルミスのティア5ガーディアンが確認されている。\n\nそれらを撃破し、このセクターを自らのものにせよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-02-f-embage.name = エンベージ
sector.asthosus-20t-02-f-embage.description = 危険に満ちた、極めて狭く閉塞感のあるセクターに降り立った。\n\n敵の攻撃は容赦がない。\n限られた空間の中で敵を押し返せ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-02-d-inferate.name = インフェレート
sector.asthosus-20t-02-d-inferate.description = 大規模な敵基地に遭遇した。\n\n[accent]イミスト[] を占領した今、あとどれほどの基地と戦わねばならないのかと思案する。\n\n敵は幾重にも防衛線を構築している。\n一つずつ着実に突破せよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-02-g-factory-unit-0047.name = ファクトリーユニット0047
sector.asthosus-20t-02-g-factory-unit-0047.description = アルミスによって建造され残された、数多くの巨大工場ユニットの一つ。\n\nこの生産複合施設は放棄されており、\n防衛能力の大半は朽ち果てている。\n\n敵は警戒を怠っている。\n\n\n[blue]補正：\n - 砲塔を用いて敵基地を攻撃可能。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-03-a-magmatic-riverbed.name = マグマの川床
sector.asthosus-20t-03-a-magmatic-riverbed.description = この地域には広大なスラグの川床が広がっている。\n激しい火山活動によって地形は険悪を極め、ほとんどのユニットが攻撃に役立たない。\n\n敵はここに厳重に防衛された大規模な前哨基地を築いている。\n\n\n[blue]補正：\n - ホバーユニットのみ使用可能。\n - 敵建造物の耐久力 +50%\n - 敵の攻撃力 +50%\n - 味方建造物の耐久力 +20%\n - 建造速度 +50%\n - ユニット生産速度 +50%\n - ユニットによる搬入はコアに対してのみ可能。\n - 建造物を解体しても資源は返還されない。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-03-barite-valley.name = 重晶石の渓谷
sector.asthosus-20t-03-barite-valley.description = 未踏のセクターに降り立った。\nこのセクターには奇妙な変異生物が生息しているようだ。\n何らかの有機生命体であるらしい。\n\n変異生物のウェーブを生き延び、橋頭堡を確保せよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-03-c-lucila.name = ルシラ
sector.asthosus-20t-03-c-lucila.description = [accent]重晶石[] の生成に必要な技術をすべて研究し終えた矢先、[accent]重晶石磨砕機[] の技術を敵に奪われてしまった。\n\n代わりに [accent]重晶石急冷プラント[] を活用して [accent]重晶石[] を生成せよ。\n高ティアのユニットを製造し、ここにある複数の敵基地を撃破せよ。\n\n\n[blue]補正：\n - 重晶石磨砕機は使用不可。\n - 重晶石急冷プラントを使って重晶石を生成すること。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-04-bioweapon-facility.name = 生物兵器施設
sector.asthosus-20t-04-bioweapon-facility.description = バライト生物に乗っ取られた大規模な研究施設。\nかつては危険な生物兵器を保管していた。\n\n現在では巣穴が基地全体を支配している。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-04-c-oasis-delta.name = オアシスデルタ
sector.asthosus-20t-04-c-oasis-delta.description = オアシス水の大河によって隔てられ、巨大な敵基地から離れた未開の領域が存在する。\n\n[accent]ヴェスモニウム[] を活用して高ティアのユニットを製造せよ。\nこの基地を打ち砕け。\n\n敵は全力を挙げて反撃してくるだろう。\n油断なく備えよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-04-d-preciptum.name = プレシプタム
sector.asthosus-20t-04-d-preciptum.description = かつて兵器実験に使われていた広大な領域。\n\nこのセクターの地形の大半は\n壊滅的な爆発によってぽっかりと口を開けた虚無と化している。\n\n敵はその残された土地の上に基地を築いた。\n\nこれを撃破せよ。\n\n\n[blue]補正：\n - 敵ユニットの攻撃力 +50%\n - 敵建造物の耐久力 +50%\n - 味方のユニット生産速度 -50%\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-05-abandoned-research-center.name = 放棄された研究センター
sector.asthosus-20t-05-abandoned-research-center.description = 敵はここに複数のコアを備えた強大な基地を築いている。\n撃破するには高ティアのユニットが必要になるだろう。\n\n迅速に行動し、素早く展開せよ。\n敵戦力に押し潰される前に敵基地を制圧せよ。\n\n\n[blue]補正：\n - 敵ユニットの攻撃力 +15%\n - 敵建造物の耐久力 +25%\n - 敵建造物の攻撃力 +25%\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-05-b-thanatos.name = タナトス
sector.asthosus-20t-05-b-thanatos.description = 広さの割に豊富な資源を蔵する辺境のセクター。\n\nここには敵の戦力がほとんどないようにも見える。だが果たして……\n\n数多の敵とガーディアンを迎え撃て。\nこのセクターを自らの手に収めよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-05-c-caldoria.name = カルドリア
sector.asthosus-20t-05-c-caldoria.description = スキャンの結果、このセクターには [accent]結晶質ジオード[] が存在しないことが判明した。\n\n敵戦力は算出不能。\n\nこのセクターを占領せよ。\n\n\n[blue]補正：\n - 結晶質ジオードが存在しない。\n - スラグ冷却成形機を使って黒曜石を生成せよ。\n - 低ティア技術はここでは使用不可。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-06-molten-heights.name = 溶融の高地
sector.asthosus-20t-06-molten-heights.description = 激しい火山活動により、一帯はスラグで満たされている。\n高地のみが手つかずのまま残されている。\n\n敵はこのセクターを極めて重要視している。容赦のないウェーブに備えよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-06-n-mune.name = ミューン
sector.asthosus-20t-06-n-mune.description = 超強化されたシールド発生装置を備えたユニット群が、あなたの進撃を阻止すべく送り込まれた。\n\n最強の武装をもって反撃せよ。\n\n\n[blue]補正：\n - 敵のあらゆる攻撃によるダメージ +25%\n - 敵は耐久値の数倍に相当するシールドを保持。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-06-o-inferno-bastion.name = 業火の要塞
sector.asthosus-20t-06-o-inferno-bastion.description = 活発な火山活動により資源が豊富な地域だが、\nそのためにセクターは大量のスラグで覆われている。\n\nかつて敵がここに定着していたものの、バライト生物によって乗っ取られた。\n\n溶融したスラグを避けつつ周囲にインフラを築き、\nこれらの生物から基地を奪還せよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-06-p-nidus.name = ニダス
sector.asthosus-20t-06-p-nidus.description = キ_ンな知_体_がこの場_に信じら_ない数のバライト生_物を結_させて_るよ_だ、直ちに――するこ_を推_す_ \n - \n[red]通信途絶、データ利用不可。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-07-finistera.name = フィニステラ
sector.asthosus-20t-07-finistera.description = 閉塞感のある窮屈なセクターに降り立った。\n\n敵はこのセクターを極めて高く評価している。\n\n敵は4方向から攻撃を仕掛けてくる。\n一部の降下地点は時間経過で起動し、残りは最初から稼働し続ける。\n\nここには大量の [accent]バライト生物[] も生息している。\n奴らの巣穴を破壊せよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。

sector.asthosus-20t-08-acropolis.name = アクロポリス
sector.asthosus-20t-08-acropolis.description = 奇妙な形状をしたセクターに迷い込んだ。\n\n敵はこれまでに見たこともないほど強大な基地をここに築き上げているようだ。\n\nこれを撃破せよ。高ティアのユニットが必要となるだろう。\n\n基地は段階的に構築されているように見える。\nおそらく最も弱い段階から順に攻略していくべきだろう。\n\n攻撃を仕掛ける前に、限られた空間を確保することを検討せよ。\n\n可能な限り勢力を広げよ。\n\n\n[accent]注記：これは任意攻略セクターです。占領しなくてもキャンペーンの完了には影響しません。
