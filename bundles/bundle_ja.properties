#Mod info

#mod.asthosus.name = アストス
#mod.asthosus.author = Catser
#mod.asthosus.description = 新たな惑星「アストス（Asthosus）」をゲームに追加するMODです。\n\nアストスは危険に満ちた荒涼とした不毛の惑星です。\n完全プレイ可能なキャンペーンを備えており、11のキャンペーンマップと21の任意攻略マップが収録されています。\n\nこれら32種類のマップに加え、アストスにはブロック、液体、アイテム、ユニット、状態異常など、180種類以上の独自コンテンツが含まれています。\nこの数には、システム内部用のユニットや環境ブロック／タイルは含まれていません。\n\nバニラ（原版）のコンテンツはほとんど流用せず、\nまったく新しく（そして願わくば）ワクワクするような要素でMODを満たすことを目指しました。\n\nこのMODには、ThePythonGuy3氏によるオリジナルBGMが収録されています！\n\n不具合の報告や感想、その他伝えたいことがあれば、\nぜひアストスのDiscordサーバーにお気軽にご参加ください。\nこのMODの攻略やヘルプが必要な場合も大歓迎です。\n\nアストスは以下の言語に対応しています：\n - English（英語）\n - German（ドイツ語）\n - Indonesian（インドネシア語）\n - Japanese（日本語）\n - Russian（ロシア語）\n - Simplified Chinese（簡体字中国語）\n - Spanish（スペイン語）\n - Traditional Chinese（繁体字中国語）\n - Ukrainian（ウクライナ語）\n\nぜひお楽しみください！
#mod.asthosus.subtitle = 重晶石含有量が68.99%増量！

#Planets

planet.asthosus-asthosus.name = アストス
planet.asthosus-asthosus.description = 荒れ果てた惑星。危険は多いけれど、無限の可能性を秘めている。頑張って！

planet.asthosus-trecara.name = [red]トレカラ - 開発中！
planet.asthosus-trecara.description = 水と生物が豊かな緑の衛星、アストスの月。鉱石が極めて希少なこの世界を、手持ちの資源を駆使して征服せよ！
planet.asthosus-trecara.details = アストスを襲い、砂漠の惑星へと変貌させた災厄が、そもそもなぜ発生したのかを知る者はいない。トレカラは、このような災厄に対する防壁として機能するはずであった。

#Campaign Objectives

genesis.ferrinite = アストスへようこそ。\n\nまずは \n[accent]フェリナイト採掘ユニット[] を4基研究・建造してください。\n\nフェリナイト採掘ユニットは \n薄い灰色の壁に向けて設置できます。\n\n濃い灰色の壁は風化しており、\nフェリナイト採掘ユニットでは採掘できません。\n\n[accent]フェリナイトコンベア[] を使って \n採掘ユニットをコアに接続してください。
genesis.demetite = 先に進むには [accent]デメタイト採掘ユニット[] を研究し、\n4基建造してください。\n\nデメタイト採掘ユニットは \n明るい砂色の壁に向けて設置できます。\n\n暗い砂色の壁は \n風化しているため、\nデメタイト採掘ユニットでは採掘できません。\n\n[accent]フェリナイトコンベア[] を使って \n[accent]デメタイト採掘ユニット[] をコアに接続してください。
genesis.walls = 敵が接近中！\n\n\ue803 敵の降下地点へ向かい、\ue803\n続けるにはそこに壁をいくつか設置してください！
genesis.catapults = 壁だけでは敵を \n食い止められません。\n\n[accent]カタパルト[] を3基研究・建造してください。\n\n[accent]フェリナイトコンベア[] を使って、\n[accent]カタパルト[] に弾薬として \nフェリナイトまたはデメタイトを供給してください。

objective.read = [accent]コアに表示された指示をよく読んでください！

ignition.power = アストスでは電力が不可欠です。\n\n技術ツリー \ue875 から [accent]フリクション採石場[] を研究し、\n指定された場所に3基建造してください。
ignition.generator = 技術ツリー \ue875 から [accent]点火発電機[] を研究してください。\n1基建造し、[accent]フリクション採石場[] で採掘した [accent]亜炭[] を供給してください。
ignition.connect = 技術ツリー \ue875 から [accent]フェリナイト電線[] を研究し、\nそれを設置して [accent]点火発電機[] をコアの隣にある [accent]修復プロジェクター[] に直接接続してください。
ignition.enemies = 敵がこちらの存在に気づきました！このセクターを防衛してください。\nこの機会に [accent]\ue810 アストスの電力システム[] に慣れておきましょう。
ignition.alert = [red]敵が接近中！\nこのセクターを防衛してください！

lattice.lodestone = [accent]磁鉄鉱[] はアストスにおいて極めて重要な資源です。\n\n[accent]磁鉄鉱ミキサー[] を研究して設置してください。\n\nミキサーを研究可能にするには、砂漠バイオームから \n[accent]硬化砂[] を採掘する必要があります。
lattice.produce = [accent]磁鉄鉱ミキサー[] にフェリナイトと硬化砂を供給し、\n[accent]磁鉄鉱[] を生産してください。\n\n硬化砂は砂漠バイオームの \n硬化砂タイルから採掘できます。
lattice.enemies = 敵が接近中！新技術を活用してコアを防衛し、制圧――

fulge.lithium = [accent]リチウム[] は多くの工程で不可欠です。\n[accent]リチウム粉砕機[] を研究し、建造してください。
fulge.create = [accent]リチウム粉砕機[] に亜炭とデメタイトを供給し、\n[accent]リチウム[] を生成してください。
fulge.enemies = 引き続きリチウムを生産し、関連技術を研究してください！\n\n敵がこちらの存在に気づきました。防衛に備えてください！
fulge.incoming = [red]敵が接近中！

immist.ground = 砲塔は移動できず、攻撃には向きません。ユニットが必要です。\n\nまずは [accent]地上組立ベイ[] を研究してから建造してください。
immist.shiv = ユニットが正常に機能するにはさまざまなパーツが必要です。\nこれらは [accent]初級コンポーネント組立機[] 内で製造できます。\n\nシヴ6体分の必要素材を製造してから先に進んでください。
immist.command = ユニットに命令を出すには [accent]コマンドモード[] が必要です。\n\n[accent]左Shift[] を押しながら左クリック＆ドラッグで範囲選択すると、ユニットのグループを選択できます。\n[accent]左Shift[] を押しながら右クリックすると、指定した地点への移動を命じられます。\n[accent]左Shift[] を押しながら経路に沿ってマウスの中ボタンをクリックすると、ユニットの移動や攻撃のコマンドを連続指定できます。\n\n[accent]Shift+G[] で全ユニットを選択、[accent]Shift+H[] で全ユニット工場を選択できます。\n\nこれらを活用し、部隊の戦略的な集合地点を設定しましょう。
immist.command.mobile = コマンドボタンを押してコマンドモードに入り、\n指で長押し＆ドラッグしてユニットのグループを選択します。\n任意の地点をタップすると命令を出せます。\n\nこれらを活用し、部隊の戦略的な集合地点を設定しましょう。
immist.constituent = 高ティアのユニットは、組立ベイに隣接して [accent]組立モジュール[] を設置した場合にのみ製造できます。\n\nユニットのティアにはすべての前提モジュールが必要であり、ティア3ユニットを製造するには\nどちらか一方ではなく、基本と高度の両方の組立モジュールが必要です。\n\n高ティアのユニットほど、より高度なコンポーネントが必要になります。\n\nこれらのパーツは、より高ティアの [accent]コンポーネント組立機[] で製造できます。
immist.skills = ユニットとそのコンポーネントの製造方法、さらに強力なユニットの建造方法を習得しました。\n\nこれらの技術を使って敵の前哨基地を撃破してください。\n軍勢はいくら大きくても困ることはありません。

igneouspeaks.obsidian = [accent]黒曜石[] は高度な建築に非常に有用です。\n\n採掘には [accent]大型フリクション採石場[]、またはそれ以上のティアの採石場が必要です。\n\n技術ツリー \ue875 から [accent]大型フリクション採石場[] を研究し、\n黒曜石バイオームにある暗い色の鉱脈の上に設置してください。\n\nこれらの採掘機は、その鉱脈から [accent]結晶質ジオード[] のみを採掘できます。\n\n使用可能な [accent]黒曜石[] を得るには、そのジオードを [accent]ジオード破砕機[] で処理する必要があります。

detrimentvalley.barite = [accent]重晶石[] は [accent]アブレージョン採石場[] 以上でなければ採掘できません。\n\n放射性バイオームの白い重晶石タイルから重晶石を採掘してください。\n\n採掘される [accent]放射塊[] は、まず [accent]重晶石磨砕機[] を使って\n使用可能な重晶石に加工する必要があります。
detrimentvalley.creatures = アストスにはある生物の種族が生息しています。\n\nそれらは有機生命体であるようです。\n\nこれらの生物は巣穴から出現します。\n\n巣穴は固有のバイオーム内で見つかります。
detrimentvalley.creatureslocate = [accent]バライト生物が現在地を特定するまで [lightgray]{0}

omega.attackstart = [red]敵ウェーブ[] 開始まで [accent]10分。\n[red]敵ユニット生産 []開始まで [accent]15分[]。
omega.basebusy = [red]敵[] は別作業に追われています。\n次のウェーブは遅延します。\n[accent]この時間を有効活用してください！\n\n[]⚠ 敵のユニット組立ベイには影響しません！ ⚠
omega.baseback = [red]敵[] の体制が整いました。\nウェーブ間の間隔が再び短縮されます。\n[accent]警戒してください！
