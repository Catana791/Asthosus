#Locale Bundle - Lores via Memory Chip

lattice.message = [ ⚠ 自動放送開始 ⚠ ]\n\n本区域は [red]BRT-3部門[] の管轄下にあり、その資産である。\n当区域の前哨基地に対する改ざんおよび破壊行為には、武力をもって対処する。\n\n[ ⚠ 自動放送終了 ⚠ ]

facunit.message1 = [red]アルミス[] は [accent]ファクトリーユニットNo.0047[] の稼働を停止した。\nこの基地は数十年間保守されておらず、荒廃するに任されている。
facunit.message2 = その工場は自力での防衛を余儀なくされ放置された。\n残されたユニット生産能力こそが、唯一の反撃手段である。
facunit.message3 = アストスには [red]アルミス[] が建設・稼働させていた数千もの工場が存在した。\nやがて維持管理は極めて困難であることが判明し、白い血液を放つ獣によって失われた工場もあった。
facunit.message4 = 工場は次々と一斉閉鎖され、砂嵐に飲み込まれるもの、\n崩壊してスクラップの山と化すもの、徐々に朽ちていくもの、さらには害獣の巣窟となるものまで現れた。
facunit.message5 = 現在稼働可能なファクトリーユニットは以下のみ：\n[accent]#0047 - ステータス = [lightgray]閉鎖\n[accent]#0072 - ステータス = [lightgray]利用不可
facunit.message6 = 数年前、工場が稼働していた頃、\n[red]アルミス[] は自力で製造できない工場へ先進装備を配送していた。
facunit.message7 = [red]アルミス[] がこのセクターを放置しているため、\n[accent]砲塔[] を使って基地を攻撃するのを妨げるものは何もない。
facunit.message8 = [red]アルミス・スクラップ処理場 [gray]#9344
facunit.message9 = [lightgray]リサイクル対象ペイロード：--73--\n焼却対象ペイロード：--107--\n\n資源カウント：277%

bioweapon.document1 = 文書B-F-022：バライト生物は高い知能を有しており、\n単純なものからやや複雑な設計図まで組み立てることが可能である。意思疎通の手段には、唸り声、カチカチという音、甲高い鳴き声などが含まれるようだ。
bioweapon.document2 = 文書B-F-197：その身体が放射性物質で構成されるようになる以前は、\n色鮮やかで密な毛皮、強靭な四肢、暗視能力、そして長く細い尾を備えるなど、一般的な哺乳類に近い構造をしていた。
bioweapon.document3 = 文書B-F-767：[red]生物兵器[] 計画は10日以内に開始される。\n防衛線はバライト生物を十分に食い止めている。生物兵器が完成すれば、変異した群れは再び根絶されるだろう。
bioweapon.unavailable = [salmon]データ利用不可

acropolis.message = アクロポリス文書 #0980\n極めて孤立した立地のため、老朽化して使用不能となった機材はすべてスクラップ処理場へ送られる。

molten.message1 = 研究文書 #7988\nバライト生物は実に興味深い存在である。\n他の生物と同じく群れで生活しながらも内紛を起こしやすく、時には優位性を誇示するために誰とでも、何とでも手を組むことがある。
molten.message2 = 研究文書 #8825\nアストスで野生の獣を手懐ける方法はいくつもある。\n資源を与えることから、ライバルに対して優位性を示す手段を提供することまで様々だ。
molten.message3 = 研究文書 #9987\n非常に協力的な性質を見せる一方で、\n自らの欲求と目的が満たされた瞬間、関係性を完全に打ち切って巣穴へと帰っていく。

infernobastion.message1 = 文書01： - 業火の要塞という名は、[red]溶融の高地[] から大量の [orange]スラグ[] が流れ込んでいること、そして強固な要塞化と無限の防衛ポテンシャルを可能にする地形に由来する。
infernobastion.message2 = 文書02： - 地形の大半は頑丈な黒曜石の層で覆われており、スラグが急速に冷えることなく高温を保てるようになっている。
infernobastion.message3 = 文書03： - 業火の要塞、かつて「インフェルノ諸島」と呼ばれていた地は、植生が咲き誇るオアシスであり、####、すなわち [red]バライト生物[] として知られる存在が生息していた。
infernobastion.message4 = 文書04： - スラグに飲み込まれる以前、オアシス時代のこの地域の気温は1089°ATU（35°C）であり、現地の住民と植生にとって適した気候だった。

nidus.message1 = このセクターの危険性ゆえに、[red]アルミス[] は十分な調査を行えなかった。\nしかし [red]アルミス[] は、[gray]------[] を刺激せずに足を踏み入れる方法を見つけ出したようだ。
nidus.message2 = このセクターのデータベースは今なお最高機密扱いであり、現在に至るまでそこに何があるのか誰も知らない。データベースにはただ「[red][データ利用不可][]」と表示されている。

#Custom Maps Objectives

felesa.redsand = [accent]赤砂濾過機[] を使って必要な資源を生産してください。健闘を祈ります！
felesa.filter = 新たに研究した [accent]赤砂濾過機[] を使って必要な資源を生産してください。
felesa.produce = [accent]赤砂濾過機[] を建造するのに十分な資源を生産してください。

#Teams

#The players team and enemy team for lore-wise, is "Trumir" and "Arumis", green is "Barite Creatures"
team.sharded.name = トルミル
team.crux.name = アルミス
team.green.name = バライト生物

#Techtree
techtree.Asthosus = アストス
techtree.Trecara = トレカラ

#Items

item.asthosus-01a-01-item-ferrinite.name = フェリナイト
item.asthosus-01a-01-item-ferrinite.description = 見た目は普通の石に似た灰色の鉱物で、インフラ建設に使用される。

item.asthosus-01a-02-item-demetite.name = デメタイト
item.asthosus-01a-02-item-demetite.description = 見た目は普通の石に似た黄色の金属鉱物で、インフラ建設に使用される。

item.asthosus-01a-03-item-lignite.name = 亜炭
item.asthosus-01a-03-item-lignite.description = 石炭に似た褐色の物質で、熱の発生や発電に利用される。

item.asthosus-01a-04-item-hardened-sand.name = 硬化砂
item.asthosus-01a-04-item-hardened-sand.description = 粒子の直径は一般的な砂よりも大きく、基礎資源の生産に使用される。

item.asthosus-01a-05-item-red-sand.name = 赤砂
item.asthosus-01a-05-item-red-sand.description = メサバイオームから採取された砂。さまざまな物質の微量成分を含んでいる。

item.asthosus-01a-06-item-lodestone.name = 磁鉄鉱
item.asthosus-01a-06-item-lodestone.description = 磁性を帯びた石で、ユニットの生産や、より高度な建築物に使用される。

item.asthosus-01a-07-item-lithium.name = リチウム
item.asthosus-01a-07-item-lithium.description = 電子機器に広く使用されている金属。

item.asthosus-01a-08-item-cretite.name = クレタイト
item.asthosus-01a-08-item-cretite.description = 亜炭、リチウム、赤砂から作られた、極めて可燃性が高く、わずかに爆発性のある複合材料。

item.asthosus-01a-08-j-item-crystalline-geode.name = 結晶質ジオード
item.asthosus-01a-08-j-item-crystalline-geode.description = 黒曜石とフェリナイトの混合結晶。使用可能な黒曜石を抽出するには、粉砕処理を行う必要がある。

item.asthosus-01a-09-item-obsidian.name = 黒曜石
item.asthosus-01a-09-item-obsidian.description = 高度な建築に使用される。直接採掘することはできないが、ジオードの粉砕やスラグの冷却処理によって入手可能。

item.asthosus-01a-10-item-irradiated-lump.name = 放射塊
item.asthosus-01a-10-item-irradiated-lump.description = 放射性を持つ鉱物の一種で、それ自体には用途がないが、重晶石に加工することができる。

item.asthosus-01a-11-item-barite.name = 重晶石
item.asthosus-01a-11-item-barite.description = 放射性を持つ鉱物。高度な建築、発電、および生産に使用される。

item.asthosus-01a-12-item-crosium.name = クロシウム
item.asthosus-01a-12-item-crosium.description = 高度な建築やユニットの製造に使用される。独自の構造により、処理方法に応じて絶縁性と導電性を可逆的に切り替えることが可能。

#Warning: Called Vesmonium in English, not Barite Webbing!!!
item.asthosus-01a-13-item-barite-webbing.name = ヴェスモニウム
item.asthosus-01a-13-item-barite-webbing.description = わずかに帯電した可燃性物質。高度な建築、防御、および生産に使用される。

item.asthosus-01a-14-item-draysten.name = ドレイステン
item.asthosus-01a-14-item-draysten.description = 終盤の建造やユニットの作成に使用される、わずかに帯電し、可燃性のある合金。ヴェスモニウムにノントラゲンを熱を加えて溶かし込むことで作られる。

#Liquids

liquid.asthosus-02b-01-pressure.name = 圧気
liquid.asthosus-02b-01-pressure.description = 無数のアストス機械の動力源として使用される。

liquid.asthosus-02b-01-q-liquid-silicon-tetrafluoride.name = 四フッ化ケイ素
liquid.asthosus-02b-01-q-liquid-silicon-tetrafluoride.description = 砲塔の冷却剤や資源精製に使用される、非常に危険なガス。

liquid.asthosus-02b-02-liquid-oasis-water.name = オアシス水
liquid.asthosus-02b-02-liquid-oasis-water.description = 砂漠バイオーム内にあるオアシスから汲み上げられる液体。冷却剤として、あるいは生産に使用される。

liquid.asthosus-02b-03-liquid-purified-oasis-water.name = 精製オアシス水
liquid.asthosus-02b-03-liquid-purified-oasis-water.description = オアシス水をふるいにかけて不純物を取り除いた水。工業機器や高品質な冷却剤として使用できる。

liquid.asthosus-02b-04-liquid-liquid-barite.name = 液体重晶石
liquid.asthosus-02b-04-liquid-liquid-barite.description = 触れたもの全てにダメージを与える、液状の重晶石。重晶石急冷プラントを使用することで、重晶石に固化させることができる。

liquid.asthosus-02b-05-liquid-nontragen.name = ノントラゲン
liquid.asthosus-02b-05-liquid-nontragen.description = オアシス水と粉末状黒曜石を加圧して作られるガス。高度な冷却剤として、また先端製造技術において用いられる。

liquid.asthosus-02b-07-arcanoma.name = アルカノマ
liquid.asthosus-02b-07-arcanoma.description = アルカナ生物の体内に見られる有機的性質を持つ液体。高温に反応して熱を吸収する性質があるようだ。

#Turrets

block.asthosus-03c-01-catapult.name = カタパルト
block.asthosus-03c-01-catapult.description = 中距離の敵に向けて小型砲弾を連射する。

block.asthosus-03c-02-spray.name = スプレー
block.asthosus-03c-02-spray.description = フェリナイト製の小型砲塔。味方施設を防衛するため、敵に向けて弾丸をばら撒く。

block.asthosus-03c-03-singe.name = シンジ
block.asthosus-03c-03-singe.description = 可燃物を弾薬として消費し、巨大な火炎を放射する。

block.asthosus-03c-04-skip.name = スキップ
block.asthosus-03c-04-skip.description = 敵に向けて跳弾するペレットを発射する。ペレットは最後のバウンド後に分裂する。

block.asthosus-03c-05-billow.name = ビロウ
block.asthosus-03c-05-billow.description = 敵に向けて液滴を高速で連射する。消火能力を持つ。

block.asthosus-03c-06-depulse.name = ディプルス
block.asthosus-03c-06-depulse.description = 地上ユニットをノックバックさせる低威力のビームを連続照射する。

block.asthosus-03c-07-subtile.name = サブタイル
block.asthosus-03c-07-subtile.description = 遠距離の敵に向けて強力な貫通砲弾を単発で発射する。稼働には圧気が必要。

block.asthosus-03c-08-shaft.name = シャフト
block.asthosus-03c-08-shaft.description = 敵に向けて極めて強力な連続レーザーを発射する小型レーザー砲塔。稼働には電力と冷却剤が必要で、東西南北の4方向にのみ射撃可能。威力は使用する冷却剤によって変化する。

block.asthosus-03c-09-cavalier.name = キャバリア
block.asthosus-03c-09-cavalier.description = チャージ後、高威力かつ敵を貫通する3連続のレーザービームを放つ。

block.asthosus-03c-10-accendret.name = アクセンドレット
block.asthosus-03c-10-accendret.description = 敵に向けて追尾・貫通・焼夷性能を備えた弾丸を発射する。

block.asthosus-03c-11-fulmination.name = フルミネーション
block.asthosus-03c-11-fulmination.description = 敵に向けて高速の貫通針を発射する。使用する弾薬によって様々な効果を発揮する。

block.asthosus-03c-12-syntaxe.name = シンタックス
block.asthosus-03c-12-syntaxe.description = 素材を加熱融解して敵に発射し、着弾地点に腐食性の水たまりを生成する。

block.asthosus-03c-13-instauro.name = インストーロ
block.asthosus-03c-13-instauro.description = 広範囲をカバーする連射式のエネルギー弾を敵に向けて発射する。

block.asthosus-03c-14-myriad.name = ミリアド
block.asthosus-03c-14-myriad.description = 追尾および分裂するミサイルを敵に向けて発射する。命中した敵に感電状態を付与する。

block.asthosus-03c-15-typhoon.name = タイフーン
block.asthosus-03c-15-typhoon.description = 敵に向けて弾丸を猛烈な勢いで連射する。単体の敵との正面戦闘に特化しており、大群に対しては効率が落ちる。

block.asthosus-03c-16-concite.name = コンサイト
block.asthosus-03c-16-concite.description = 左右交互に強力な貫通弾を敵に向けて発射する。大群の殲滅に特化しており、単体目標に対しては効率が落ちる。

block.asthosus-03c-17-tralux.name = トラルクス
block.asthosus-03c-17-tralux.description = 敵に向けて純粋なエネルギーの連続破壊光線を照射し、放射線状態を付与する。

block.asthosus-03c-18-verite.name = ヴェリテ
block.asthosus-03c-18-verite.description = 長射程・高精度の砲塔。敵に向けて貫通弾を発射する。稼働には圧気が必要。

#Warning: Called Comedite in English, not Missile Battery!!!
block.asthosus-03c-19-missile-battery.name = コメディテ
block.asthosus-03c-19-missile-battery.description = ヴェスモニウムまたはドレイステンを弾薬として使用し、敵に向けて高速でミサイルの一斉射撃を行う。

#Warning: Called Preject in English, not Draysten Mortar!!!
block.asthosus-03c-20-draysten-mortar.name = プリジェクト
block.asthosus-03c-20-draysten-mortar.description = 長距離へ砲弾を打ち上げ、着弾時に激しく爆発する強力な砲塔。稼働には圧気が必要。

#Drills/Production Blocks

block.asthosus-04d-01-ferrinite-mining-unit.name = フェリナイト採掘ユニット
block.asthosus-04d-01-ferrinite-mining-unit.description = フェリナイト壁からフェリナイトをゆっくりと採掘する。風化したフェリナイト壁には機能しない。

block.asthosus-04d-02-demetite-mining-unit.name = デメタイト採掘ユニット
block.asthosus-04d-02-demetite-mining-unit.description = デメタイト壁からデメタイトをゆっくりと採掘する。風化したデメタイト壁には機能しない。

block.asthosus-04d-03-ferrinite-crusher.name = フェリナイト破砕機
block.asthosus-04d-03-ferrinite-crusher.description = フェリナイト壁からフェリナイトを採掘する。稼働には圧気が必要。通常のフェリナイト採掘ユニットより効率が高い。

block.asthosus-04d-04-demetite-crusher.name = デメタイト破砕機
block.asthosus-04d-04-demetite-crusher.description = デメタイト壁からデメタイトを採掘する。稼働には圧気が必要。通常のデメタイト採掘ユニットより効率が高い。

block.asthosus-04d-05-friction-quarry.name = フリクション採石場
block.asthosus-04d-05-friction-quarry.description = 小規模な摩擦爆発を起こし、地面から基本資源を採掘する。
block.asthosus-04d-05-friction-quarry.details = ブースト効果：採掘速度 +20%。

block.asthosus-04d-06-friction-quarry-large.name = 大型フリクション採石場
block.asthosus-04d-06-friction-quarry-large.description = 摩擦爆発を起こし、地面から基本資源を採掘する。磁鉄鉱で補強されている。
block.asthosus-04d-06-friction-quarry-large.details = ブースト効果：採掘速度 +20%。

block.asthosus-04d-07-abrasion-quarry.name = アブレージョン採石場
block.asthosus-04d-07-abrasion-quarry.description = 大規模な摩擦爆発を起こし、地面から資源を大量に採掘する。黒曜石で強化されており、高度な資源の採掘が可能。稼働には電力が必要。
block.asthosus-04d-07-abrasion-quarry.details = ブースト効果：採掘速度 +30%。

block.asthosus-04d-08-discharge-quarry.name = ディスチャージ採石場
block.asthosus-04d-08-discharge-quarry.description = 強力な放電爆発を起こし、地面から資源を大量に採掘する。重晶石で強化されており、高度な資源の採掘が可能。稼働には電力が必要。
block.asthosus-04d-08-discharge-quarry.details = ブースト効果：採掘速度 +30%。

block.asthosus-04d-09-geothermal-accumulator.name = 地熱ガス収集機
block.asthosus-04d-09-geothermal-accumulator.description = 噴気孔から四フッ化ケイ素ガスを収集し、精製工程に利用する。

block.asthosus-04d-10-decompression-extractor.name = 減圧抽出機
block.asthosus-04d-10-decompression-extractor.description = 四フッ化ケイ素ガスの基礎成分と硬化砂を用い、少量のフェリナイトとデメタイトを生成する。副産物として通常の砂および赤砂も排出する。
block.asthosus-04d-10-decompression-extractor.details = 化学分解を利用して鉱物マトリックスから微量元素を抽出する。SiF4がケイ酸塩と反応することで希少物質を遊離させ、使用可能な形態へと再圧縮する。総アイテム数の増加は質量複製ではなく、潜在していた微量成分の回収によるものである。

block.asthosus-04d-11-geode-cracker.name = ジオード破砕機
block.asthosus-04d-11-geode-cracker.description = 結晶質ジオードを砕いてフェリナイト層を取り除き、使用可能な黒曜石へと加工する。

block.asthosus-04d-12-slag-cooling-mold.name = スラグ冷却成形機
block.asthosus-04d-12-slag-cooling-mold.description = 大量の高温溶融スラグをオアシス水で冷却し、黒曜石を生成する。

#Distribution Blocks

#Warning: Called Ferrinite Pipeline in English not Ferrinite Duct!!!
block.asthosus-05e-01-ferrinite-duct.name = フェリナイトコンベア
block.asthosus-05e-01-ferrinite-duct.description = 負圧を利用してアイテムを輸送する。

#Warning: Called Transverse Pipeline in English not Transverse Duct!!!
block.asthosus-05e-02-transverse-duct.name = トランスバースコンベア
block.asthosus-05e-02-transverse-duct.description = 磁力を利用してアイテムを前方に輸送する。

#Warning: Called Crosium Belt in English not Crosium Conveyor!!!
block.asthosus-05e-03-crosium-conveyor.name = クロシウムベルト
block.asthosus-05e-03-crosium-conveyor.description = アイテムを束にして輸送する。末端では3方向にアイテムを出力する。

#Warning: Called Pipeline Router in English!!!
block.asthosus-05e-04-ferrinite-duct-router.name = パイプルーター
block.asthosus-05e-04-ferrinite-duct-router.description = フェリナイト製。入力されたアイテムを3方向に均等分配する。

#Warning: Called Pipeline Distributor in English!!!
block.asthosus-05e-04-g-ferrinite-duct-distributor.name = パイプ分配器
block.asthosus-05e-04-g-ferrinite-duct-distributor.description = 大型のパイプルーター。入力されたアイテムを7方向に均等分配する。

#Warning: Called Pipeline Junction in English!!!
block.asthosus-05e-05-ferrinite-duct-junction.name = パイプジャンクション
block.asthosus-05e-05-ferrinite-duct-junction.description = 2本のコンベアを交差させることができる。

#Warning: Called Ferrinite Pipeline Bridge in English!!!
block.asthosus-05e-06-ferrinite-duct-bridge.name = フェリナイトブリッジコンベア
block.asthosus-05e-06-ferrinite-duct-bridge.description = コンベアや地形を越えてアイテムを輸送する。

#Warning: Called Pipeline Sorter in English!!!
block.asthosus-05e-07-duct-sorter.name = パイプソーター
block.asthosus-05e-07-duct-sorter.description = 入力されたアイテムが選択したものと一致すれば前方へ通し、そうでなければ左右へ出力する。

#Warning: Called Inverted Pipeline Sorter in English!!!
block.asthosus-05e-08-duct-sorter-inverted.name = 逆パイプソーター
block.asthosus-05e-08-duct-sorter-inverted.description = パイプソーターと同様に機能するが、選択したアイテムを直進ではなく左右へ出力する。

block.asthosus-05e-09-overflow-controller.name = オーバーフロー制御器
block.asthosus-05e-09-overflow-controller.description = まず前方にアイテムを出力し、前方が塞がっている場合のみ左右へ出力する。

block.asthosus-05e-09-p-underflow-controller.name = アンダーフロー制御器
block.asthosus-05e-09-p-underflow-controller.description = まず左右にアイテムを出力し、左右が塞がっている場合のみ前方へ出力する。

block.asthosus-05e-10-heavy-unloader.name = 大型アンローダー
block.asthosus-05e-10-heavy-unloader.description = コアからアイテムを取り出せない指向性アンローダー。

block.asthosus-05e-10-i-kinetic-propulsor.name = キネティックプロパルサー
block.asthosus-05e-10-i-kinetic-propulsor.description = 範囲内にある別のキネティックプロパルサーへ、アイテムの束を中距離射出する。電力が必要。

#Warning: Called Cargo Base Station in English!!!
block.asthosus-05e-11-unit-cargo-base-station.name = 貨物発着ステーション
block.asthosus-05e-11-unit-cargo-base-station.description = 貨物投下ポイントへ送るアイテムを貨物ドローンに積み込む。

#Warning: called Cargo Drop Point in English!!!
block.asthosus-05e-12-unit-cargo-drop-point.name = 貨物投下ポイント
block.asthosus-05e-12-unit-cargo-drop-point.description = アルヴェウス貨物ドローンが投下したアイテムを受け取る。

block.asthosus-05e-13-heat-distributor.name = 熱分配器
block.asthosus-05e-13-heat-distributor.description = 他の熱分配器や熱を消費する施設へ熱を伝達する。

#Liquid Blocks

block.asthosus-06f-01-aqueduct.name = 液体導管
block.asthosus-06f-01-aqueduct.description = 液体を前方に輸送する。未接続の端から液体が漏れることはない。

block.asthosus-06f-01-b-viaduct.name = 高速液体導管
block.asthosus-06f-01-b-viaduct.description = 黒曜石で作られた、耐久性と輸送速度が高い液体導管。

block.asthosus-06f-02-aqueduct-junction.name = 液体ジャンクション
block.asthosus-06f-02-aqueduct-junction.description = 2本の液体導管を交差させるために使用する。

block.asthosus-06f-03-aqueduct-router.name = 液体分配器
block.asthosus-06f-03-aqueduct-router.description = 入力された液体を3方向に均等分配する。

block.asthosus-06f-04-aqueduct-bridge.name = 液体ブリッジ
block.asthosus-06f-04-aqueduct-bridge.description = 複数の輸送ラインや地形を越えて液体導管を接続するために使用する。

block.asthosus-06f-05-lodestone-pump.name = 磁鉄鉱ポンプ
block.asthosus-06f-05-lodestone-pump.description = 液体タイルから液体をゆっくりと汲み上げる。

block.asthosus-06f-06-exothermic-pump.name = 発熱ポンプ
block.asthosus-06f-06-exothermic-pump.description = 液体タイルから液体を汲み上げる。稼働には亜炭が必要。
block.asthosus-06f-06-exothermic-pump.details = 0.5 亜炭/秒

block.asthosus-06f-07-oasis-water-sieve.name = オアシス水濾過機
block.asthosus-06f-07-oasis-water-sieve.description = オアシス水を濾過し、精製オアシス水を生成する。

block.asthosus-06f-07-p-oasis-water-griddle.name = オアシス水蒸留器
block.asthosus-06f-07-p-oasis-water-griddle.description = 赤砂を用いてオアシス水を精製し、精製オアシス水を生成する。通常のオアシス水濾過機より効率が高い。

block.asthosus-06f-08-liquid-vat.name = 液体タンク
block.asthosus-06f-08-liquid-vat.description = 液体を貯蔵し、全方向へ出力する。

block.asthosus-06f-09-liquid-silo.name = 液体サイロ
block.asthosus-06f-09-liquid-silo.description = 大量の液体を貯蔵し、全方向へ出力する。

#Power Blocks

block.asthosus-07g-01-ferrinite-wire.name = フェリナイト電線
block.asthosus-07g-01-ferrinite-wire.description = 他の電線に隣接して設置すると電力を伝達する。ごく少量の電力を蓄えることもできる。

block.asthosus-07g-02-reinforced-wire.name = 強化電線
block.asthosus-07g-02-reinforced-wire.description = 他の電線に隣接して設置すると電力を伝達する。通常の電線より蓄電容量が大きく、耐久性も大幅に高い。

block.asthosus-07g-03-rectifier.name = 整流器
block.asthosus-07g-03-rectifier.description = 出力側の蓄電量が入力側より少ない場合にのみ、一方向へ電力を送電する。

block.asthosus-07g-04-network-terminal.name = 電力網ターミナル
block.asthosus-07g-04-network-terminal.description = 電線に接続し、システム内の現在の電力と蓄電量を表示する。

block.asthosus-07g-05-connector-node.name = 接続ノード
block.asthosus-07g-05-connector-node.description = 電線同士を直接つなぐことなく、短距離間で接続する電線用ブリッジ。

block.asthosus-07g-06-power-cell.name = 蓄電セル
block.asthosus-07g-06-power-cell.description = 電力を保持・貯蔵するためのシンプルな蓄電セル。

block.asthosus-07g-06-q-voltage-capacitator.name = 蓄電コンデンサ
block.asthosus-07g-06-q-voltage-capacitator.description = 通常の蓄電セルよりも大量の電力を蓄えられるコンデンサ。

block.asthosus-07g-07-ignition-generator.name = 点火発電機
block.asthosus-07g-07-ignition-generator.description = 可燃物を燃焼させて少量の電力を生み出す。

block.asthosus-07g-08-pressure-turbine.name = 圧気タービン
block.asthosus-07g-08-pressure-turbine.description = 圧気を利用してより多くの電力を生み出す。

block.asthosus-07g-09-cretite-turbine.name = クレタイトタービン
block.asthosus-07g-09-cretite-turbine.description = 極めて可燃性の高いクレタイトと、冷却剤として精製オアシス水を用い、中規模の電力を生み出す。

block.asthosus-07g-10-discharge-generator.name = 放電発電機
block.asthosus-07g-10-discharge-generator.description = 帯電した素材を放電させて発電する。徐々に圧気が蓄積し、上限に達すると爆発する。

#Warning: Called Radiation Reactor in English!!!
block.asthosus-07g-11-radiation-power-plant.name = 放射能反応炉
block.asthosus-07g-11-radiation-power-plant.description = 重晶石の噴気孔の上に設置し、噴気孔から放出される放射線を利用して発電する。

block.asthosus-07g-11-s-diffusion-reactor.name = 拡散反応炉
block.asthosus-07g-11-s-diffusion-reactor.description = ノントラゲンと四フッ化ケイ素の混合ガスを熱で拡散させて発電する。冷却剤が不足すると激しく爆発する。

block.asthosus-07g-12-draysten-destabilizer.name = ドレイステン崩壊反応炉
block.asthosus-07g-12-draysten-destabilizer.description = 核分裂の力でドレイステンを崩壊させ、極めて高い電力出力を得る。爆発を防ぐため強力な冷却が必要。

#Walls

block.asthosus-08h-01-ferrinite-wall-small.name = フェリナイトの壁
block.asthosus-08h-01-ferrinite-wall-small.description = 施設を敵の攻撃によるダメージから保護する。

block.asthosus-08h-02-ferrinite-wall-large.name = 大きなフェリナイトの壁
block.asthosus-08h-02-ferrinite-wall-large.description = フェリナイト製の大型の壁。味方施設をダメージから保護する。

block.asthosus-08h-03-lodestone-wall-small.name = 磁鉄鉱の壁
block.asthosus-08h-03-lodestone-wall-small.description = 磁鉄鉱製の壁。電撃を遮断し、電力接続を断ち切る。

block.asthosus-08h-04-lodestone-wall-large.name = 大きな磁鉄鉱の壁
block.asthosus-08h-04-lodestone-wall-large.description = 磁鉄鉱製の大型の壁。電撃を遮断し、電力接続を断ち切る。

block.asthosus-08h-05-lithium-wall-small.name = リチウムの壁
block.asthosus-08h-05-lithium-wall-small.description = 帯電したリチウム製の壁。時折アーク放電を放ち、周囲の敵にダメージを与える。

block.asthosus-08h-06-lithium-wall-large.name = 大きなリチウムの壁
block.asthosus-08h-06-lithium-wall-large.description = 帯電したリチウム製の大型の壁。時折アーク放電を放ち、周囲の敵にダメージを与える。

block.asthosus-08h-07-obsidian-wall-small.name = 黒曜石の壁
block.asthosus-08h-07-obsidian-wall-small.description = 黒曜石製の壁。味方施設をダメージから保護する。破壊されると破片を飛び散らせて周囲にダメージを与える。

block.asthosus-08h-08-obsidian-wall-large.name = 大きな黒曜石の壁
block.asthosus-08h-08-obsidian-wall-large.description = 黒曜石製の大型の壁。味方施設をダメージから保護する。破壊されると破片を飛び散らせて周囲にダメージを与える。

block.asthosus-08h-09-barite-wall-small.name = 重晶石の壁
block.asthosus-08h-09-barite-wall-small.description = 重晶石製の壁。味方施設をダメージから保護し、周囲の敵に放射線状態を付与する。

block.asthosus-08h-10-barite-wall-large.name = 大きな重晶石の壁
block.asthosus-08h-10-barite-wall-large.description = 重晶石製の大型の壁。味方施設をダメージから保護し、周囲の敵に放射線状態を付与する。

block.asthosus-08h-11-crosium-wall-small.name = クロシウムの壁
block.asthosus-08h-11-crosium-wall-small.description = クロシウム製の壁。味方施設をダメージから防衛する。レーザーを吸収し、電力を伝導できる。

block.asthosus-08h-12-crosium-wall-large.name = 大きなクロシウムの壁
block.asthosus-08h-12-crosium-wall-large.description = クロシウム製の大型の壁。味方施設をダメージから防衛する。レーザーを吸収し、電力を伝導できる。

#Warning: Called Projector Wall in English!!!
block.asthosus-08h-13-webbing-wall-small.name = バリア壁
block.asthosus-08h-13-webbing-wall-small.description = ヴェスモニウム製の壁。バリアを展開できる。破壊時に爆発し、命中した敵を一時的にスタンさせる。弱威力の攻撃に対して高い耐性を持つ。

#Warning: Called Large Projector Wall in English!!!
block.asthosus-08h-14-webbing-wall-large.name = 大きなバリア壁
block.asthosus-08h-14-webbing-wall-large.description = ヴェスモニウム製の大型の壁。バリアを展開できる。破壊時に爆発し、命中した敵を一時的にスタンさせる。弱威力の攻撃に対して高い耐性を持つ。

block.asthosus-08h-15-draysten-wall-small.name = ドレイステンの壁
block.asthosus-08h-15-draysten-wall-small.description = ドレイステン製の頑丈な壁。周囲の敵を減速させる。稼働には電力が必要で、電力を伝導する。

block.asthosus-08h-16-draysten-wall-large.name = 大きなドレイステンの壁
block.asthosus-08h-16-draysten-wall-large.description = ドレイステン製の頑丈な大型の壁。周囲の敵を減速させる。稼働には電力が必要で、電力を伝導する。通常のドレイステンの壁より減速時間が長く、効果範囲も広い。

#Production Blocks/Crafters

block.asthosus-09i-01-lodestone-mixer.name = 磁鉄鉱ミキサー
block.asthosus-09i-01-lodestone-mixer.description = フェリナイトと硬化砂を混合・磁化して磁鉄鉱を生成する。同時に砂も排出する。

block.asthosus-09i-02-lodestone-basin.name = 磁鉄鉱溶融槽
block.asthosus-09i-02-lodestone-basin.description = フェリナイトを融解してから硬化砂と混ぜ合わせることで、より効率的に磁鉄鉱を生成する。冷却にはオアシス水が必要。

block.asthosus-09i-03-lithium-grinder.name = リチウム粉砕機
block.asthosus-09i-03-lithium-grinder.description = デメタイトと亜炭を粉砕して粉末にし、リチウムを生成する。

block.asthosus-09i-04-lithium-compactor.name = リチウム圧縮機
block.asthosus-09i-04-lithium-compactor.description = デメタイトと亜炭を粉砕・圧縮してリチウムを生成する。通常のリチウム粉砕機より効率が高い。

block.asthosus-09i-05-cretite-mixer.name = クレタイトミキサー
block.asthosus-09i-05-cretite-mixer.description = リチウムを融解し、粉末化した亜炭と赤砂を混合して極めて可燃性の高いクレタイトを生成する。

block.asthosus-09i-06-barite-quern.name = 重晶石磨砕機
block.asthosus-09i-06-barite-quern.description = 放射塊を粉砕し、使用・建築可能な重晶石に加工する。稼働には電力が必要。

block.asthosus-09i-07-barite-cooler.name = 重晶石急冷プラント
block.asthosus-09i-07-barite-cooler.description = 液体重晶石をオアシス水で冷却し、重晶石を生成する。

block.asthosus-09i-08-crosium-infuser.name = クロシウム含浸機
block.asthosus-09i-08-crosium-infuser.description = 黒曜石に精製オアシス水を含浸させた後、圧縮してクロシウムを生成する。稼働には電力と圧気が必要。

#Warning: Called Vesmonium Accultor in English!!!
block.asthosus-09i-09-barite-loom.name = ヴェスモニウム織成機
block.asthosus-09i-09-barite-loom.description = 重晶石と亜炭からヴェスモニウムを生成する。稼働には電力と圧気が必要。重晶石タイルの上では効率が向上する。

block.asthosus-09i-10-draysten-crucible.name = ドレイステン溶融炉
block.asthosus-09i-10-draysten-crucible.description = ヴェスモニウムとノントラゲンからドレイステンを生成する。稼働には熱と電力が必要。

block.asthosus-09i-11-nontragen-synthesizer.name = ノントラゲン合成機
block.asthosus-09i-11-nontragen-synthesizer.description = 黒曜石を粉末状黒曜石に粉砕し、圧気を用いてオアシス水と加圧混合することでノントラゲンを生成する。稼働には電力が必要。

block.asthosus-09i-12-pressure-rig.name = 圧気抽出リグ
block.asthosus-09i-12-pressure-rig.description = 地熱噴気孔の圧力を取り込み、利用可能な圧気として供給する。

block.asthosus-09i-13-expansion-tank.name = 膨張タンク
block.asthosus-09i-13-expansion-tank.description = 熱を利用して圧気を生成する。

block.asthosus-09i-14-large-expansion-tank.name = 大型膨張タンク
block.asthosus-09i-14-large-expansion-tank.description = 熱を利用して圧気を生成する。通常の膨張タンクより高速かつ高効率に圧気を生成できる。

block.asthosus-09i-15-lignite-burner.name = 亜炭燃焼炉
block.asthosus-09i-15-lignite-burner.description = 可燃性の亜炭を燃焼させて熱を発生させ、生成した熱を全方向へ均等に出力する。

block.asthosus-09i-16-cretite-etna.name = クレタイトエトナ炉
block.asthosus-09i-16-cretite-etna.description = 極めて可燃性の高いクレタイトを燃焼させて熱を発生させる。亜炭燃焼炉より高効率で、生成した熱を全方向へ均等に出力する。稼働には電力が必要。

block.asthosus-09i-17-solar-heater-panel.name = 太陽熱発電パネル
block.asthosus-09i-17-solar-heater-panel.description = 少量の熱と電力を受動的に生産する。

block.asthosus-09i-18-red-sand-filter.name = 赤砂濾過機
block.asthosus-09i-18-red-sand-filter.description = オアシス水を使って赤砂を濾過し、砂に加えて少量のフェリナイト、デメタイト、亜炭を生成する。精製オアシス水も排出する。稼働には圧気が必要。

block.asthosus-09i-19-sand-compactor.name = 砂圧縮機
block.asthosus-09i-19-sand-compactor.description = 通常の砂を再び硬化砂へと圧縮し、再利用可能にする。稼働には圧気が必要。

block.asthosus-09i-20-pyre.name = 焼却炉
block.asthosus-09i-20-pyre.description = 電力を使用して、入力されたアイテムを焼却・消滅させる。

#Unit Blocks

block.asthosus-10j-00-ground-mounting-bay.name = 地上組立ベイ
block.asthosus-10j-00-ground-mounting-bay.description = ペイロードを使用して地上ユニットを製造する。稼働には電力が必要。

block.asthosus-10j-01-tank-mounting-bay.name = 戦車組立ベイ
block.asthosus-10j-01-tank-mounting-bay.description = ペイロードを使用して戦車ユニットを製造する。稼働には電力が必要。

block.asthosus-10j-02-support-mounting-bay.name = 支援組立ベイ
block.asthosus-10j-02-support-mounting-bay.description = ペイロードを使用して支援ユニットを製造する。稼働には電力が必要。

block.asthosus-10j-03-hover-mounting-bay.name = ホバー組立ベイ
block.asthosus-10j-03-hover-mounting-bay.description = ペイロードを使用してホバーユニットを製造する。稼働には電力が必要。

block.asthosus-10j-04-basic-assembler-constituent.name = 基本組立モジュール
block.asthosus-10j-04-basic-assembler-constituent.description = 組立ベイの組立枠に隣接して設置すると、組立ティアを1段階上昇させる。追加のペイロード搬入口としても使用可能。

block.asthosus-10j-05-advanced-assembler-constituent.name = 高度組立モジュール
block.asthosus-10j-05-advanced-assembler-constituent.description = 組立ベイの組立枠に隣接して設置すると、組立ティアを2段階上昇させる。追加のペイロード搬入口としても使用可能。機能するには下位のモジュールも建造されている必要がある。

block.asthosus-10j-06-progressive-assembler-constituent.name = 先進組立モジュール
block.asthosus-10j-06-progressive-assembler-constituent.description = 組立ベイの組立枠に隣接して設置すると、組立ティアを3段階上昇させる。追加のペイロード搬入口としても使用可能。機能するには下位のモジュールもすべて建造されている必要がある。

block.asthosus-10j-07-cumulative-assembler-constituent.name = 統合組立モジュール
block.asthosus-10j-07-cumulative-assembler-constituent.description = 組立ベイの組立枠に隣接して設置すると、組立ティアを4段階上昇させる。追加のペイロード搬入口としても使用可能。機能するには下位のモジュールもすべて建造されている必要がある。

block.asthosus-10j-08-component-disassembler.name = コンポーネント分解機
block.asthosus-10j-08-component-disassembler.description = 圧気と電力を使用してユニットコンポーネントを分解し、素材を取り出す。

#Warning: Called Elementary Component Assembler in English!!!
block.asthosus-10j-09-component-assembler.name = 初級コンポーネント組立機
block.asthosus-10j-09-component-assembler.description = ユニットの組み立てに使うごく基本的なコンポーネントを製造する。稼働には電力が必要。\n 接触しているブロックへ電力を伝導する。\n\n レシピ：\n - カタパルト\n - スプレー\n - シンジ\n - リチウムの壁\n - 大きなリチウムの壁\n - 磁鉄鉱の壁\n - 大きな磁鉄鉱の壁\n - 貨物コンベア

block.asthosus-10j-10-rudimentary-component-assembler.name = 基礎コンポーネント組立機
block.asthosus-10j-10-rudimentary-component-assembler.description = ユニットの組み立てに使う基本的なコンポーネントを製造する。稼働には電力と圧気が必要。\n 接触しているブロックへ電力を伝導する。\n\n レシピ：\n - スキップ\n - ディプルス\n - ビロウ\n - リチウムの壁\n - 大きなリチウムの壁\n - 磁鉄鉱の壁\n - 大きな磁鉄鉱の壁\n - 黒曜石の壁\n - 大きな黒曜石の壁\n - 修復プロジェクター\n - 貨物コンベア\n - メカニカルジョイント\n - ミサイルオートフォージ

block.asthosus-10j-11-median-component-assembler.name = 中級コンポーネント組立機
block.asthosus-10j-11-median-component-assembler.description = ユニットの組み立てに使うコンポーネントを製造する。稼働には電力と圧気が必要。\n 接触しているブロックへ電力を伝導する。\n\n レシピ：\n - サブタイル\n - インストーロ\n - アクセンドレット\n - フルミネーション\n - リチウムの壁\n - 大きなリチウムの壁\n - 磁鉄鉱の壁\n - 大きな磁鉄鉱の壁\n - 黒曜石の壁\n - 大きな黒曜石の壁\n - 重晶石の壁\n - 大きな重晶石の壁\n - 修復プロジェクター\n - 修復ドーム\n - メカニカルジョイント\n - 大型ミサイルオートフォージ

block.asthosus-10j-12-progressive-component-assembler.name = 先進コンポーネント組立機
block.asthosus-10j-12-progressive-component-assembler.description = ユニットの組み立てに使う高度なコンポーネントを製造する。稼働には電力、圧気、ノントラゲンが必要。\n 接触しているブロックへ電力を伝導する。\n\n レシピ：\n - ミリアド\n - タイフーン\n - コンサイト\n - 重晶石の壁\n - 大きな重晶石の壁\n - クロシウムの壁\n - 大きなクロシウムの壁\n - 修復ドーム\n - バリアプロジェクター

block.asthosus-10j-13-cumulative-component-assembler.name = 統合コンポーネント組立機
block.asthosus-10j-13-cumulative-component-assembler.description = ユニットの組み立てに使う最高ティアのコンポーネントを製造する。稼働には電力、圧気、ノントラゲンが必要。\n 接触しているブロックへ電力を伝導する。\n\n レシピ：\n - ヴェリテ\n - プリジェクト\n - コメディテ\n - 重晶石の壁\n - 大きな重晶石の壁\n - クロシウムの壁\n - 大きなクロシウムの壁\n - バリア壁\n - 大きなバリア壁\n - ドレイステンの壁\n - 大きなドレイステンの壁\n - 修復ドーム\n - バリアプロジェクター

block.asthosus-10j-14-freight-conveyor.name = 貨物コンベア
block.asthosus-10j-14-freight-conveyor.description = ユニットなどのペイロードを前方に輸送する。磁気式。

block.asthosus-10j-15-freight-router.name = 貨物分配器
block.asthosus-10j-15-freight-router.description = 入力されたペイロードを最大3つの出力方向へ分配する。

block.asthosus-10j-16-unit-resynthesizer.name = ユニット修復機
block.asthosus-10j-16-unit-resynthesizer.description = 範囲内のすべてのユニットを継続的に修復する。稼働には電力が必要。

block.asthosus-10j-17-freight-launcher.name = 貨物ランチャー
block.asthosus-10j-17-freight-launcher.description = 接続された別の貨物ランチャーへペイロードを射出する。稼働には電力と圧気が必要。

#Cores

block.asthosus-11k-01-core-essence.name = コア：エッセンス
block.asthosus-11k-01-core-essence.description = 拠点のコア。装甲を備え、中程度のアイテムを貯蔵できる。

block.asthosus-11k-02-core-substratum.name = コア：サブストラタム
block.asthosus-11k-02-core-substratum.description = 拠点のコア。強固な装甲を備え、大量のアイテムを貯蔵できる。

block.asthosus-11k-03-core-omphalos.name = コア：オンファロス
block.asthosus-11k-03-core-omphalos.description = 拠点のコア。極めて優れた装甲を備え、莫大な量のアイテムを貯蔵できる。

block.asthosus-11k-04-core-petra.name = コア：ペトラ
block.asthosus-11k-04-core-petra.description = 拠点のコア。装甲を備え、中程度の資源を貯蔵できる。コア：エッセンスより多くのユニットを稼働可能。

block.asthosus-11k-05-core-silex.name = コア：シレックス
block.asthosus-11k-05-core-silex.description = 拠点のコア。強固な装甲を備え、大量のアイテムを貯蔵できる。コア：サブストラタムより多くのユニットを稼働可能。

block.asthosus-11k-06-core-summit.name = コア：サミット
block.asthosus-11k-06-core-summit.description = 拠点のコア。驚異的な装甲を備え、膨大な量のアイテムを貯蔵できる。コア：オンファロスより多くのユニットを稼働可能。

#Effect Blocks

block.asthosus-11k-07-storage-capsule.name = 貯蔵カプセル
block.asthosus-11k-07-storage-capsule.description = より多くのアイテムを貯蔵する。耐久力は低い。

block.asthosus-11k-08-explosive-mine.name = 爆発トラップ
block.asthosus-11k-08-explosive-mine.description = 敵が踏み込むと爆発し、かなりの高ダメージを与える。

block.asthosus-11k-09-barrier-projector.name = バリアプロジェクター
block.asthosus-11k-09-barrier-projector.description = 電力が供給されると正方形のバリアを展開し、味方の施設とユニットをダメージから保護する。任意でヴェスモニウムによるブーストが可能。

block.asthosus-11k-10-restoration-projector.name = 修復プロジェクター
block.asthosus-11k-10-restoration-projector.description = 周囲の味方ブロックをゆっくり修復する。稼働には電力が必要。任意でリチウムによるブーストが可能。修復効果は重複しない。

block.asthosus-11k-11-restoration-dome.name = 修復ドーム
block.asthosus-11k-11-restoration-dome.description = 周囲の味方ブロックをゆっくり修復する。稼働には電力が必要。通常の修復プロジェクターより範囲が広く、耐久値回復も速い。任意でヴェスモニウムによるブーストが可能。効果は重複しない。

#Logic Blocks

block.asthosus-12l-01-logic-chip.name = ロジックチップ
block.asthosus-12l-01-logic-chip.description = ロジック命令を実行し、ユニットや建造物を制御できる。

block.asthosus-12l-02-logic-control.name = ロジックスイッチ
block.asthosus-12l-02-logic-control.description = ロジックチップの有効・無効を切り替える。

#Warning: Called Message Chip in English!!!
block.asthosus-12l-03-hardened-message.name = メッセージチップ
block.asthosus-12l-03-hardened-message.description = 味方間での連絡用メッセージを保存する。

block.asthosus-12l-04-logic-screen.name = ロジックスクリーン
block.asthosus-12l-04-logic-screen.description = ロジックデータをグラフィックとして出力する。

block.asthosus-12l-05-memory-chip.name = メモリチップ
block.asthosus-12l-05-memory-chip.description = ロジック命令や数値を記憶する。

#Unit Components/Parts

block.asthosus-autoforge.name = ミサイルオートフォージ
block.asthosus-autoforge.description = ミサイルを生成する鍛造装置。ホバーユニットの製造に使用する。

block.asthosus-large-autoforge.name = 大型ミサイルオートフォージ
