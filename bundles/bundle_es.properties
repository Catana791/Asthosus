caldoria.mold = Se te está suministrando un [accent]Slag Cooling Mold.\n\n¡Asegúrate de no perderlo!\nÚsalo para crear tu producción de [accent]Obsidian[].
caldoria.information = Los escaneos indican que no hay [accent]Crystalline Geodes[] cerca.\nUsa [accent]Slag Cooling Mold[] para crear [accent]Obsidian[] en su lugar.\n\nEncontrarás uno de ellos a tu abajo a la izquierda.\n\nAsegúrate de no perderlo.

acropolis.lilboi = Producción de [yellow]Shennong[] y [red]Shiv[] comenzando en [lightgray]{0}
acropolis.expound = Producción de [green]Expound[] comenzando en [lightgray]{0}

lucila.quern = Nuestra tecnología de [accent]Barite Quern[] fue robada por la facción [red]Arumis[],\n¡necesitamos recuperarla a toda costa!!!\n\nUtiliza [accent]Barite Coolers[] como una forma alternativa de obtener [accent]Barite[].

#Locale Bundle - Lores via Memory Chip

lattice.message = [ ⚠ INICIANDO TRANSMISIÓN AUTOMATIZADA ⚠ ]\n\nESTA UBICACIÓN ES PROPIEDAD DE LA [red]DIVISIÓN BRT-3[].\nLA MANIPULACIÓN O DESTRUCCIÓN DEL PUESTO AVANZADO DE ESTA UBICACIÓN SERÁ ENFRENTADA CON EL USO DE LA FUERZA.\n\n[ ⚠ FIN DE LA TRANSMISIÓN AUTOMATIZADA ⚠ ]

facunit.message1 = Los [red]Arumis[] cerraron la operación de la [accent]Factory Unit No.0047[]\nLa base no ha sido mantenida en décadas dejándola marchitarse.
facunit.message2 = La fábrica fue dejada a su suerte.\nCualquier producción de unidades que tenga, es su única forma de luchar.
facunit.message3 = Asthosus tenía miles de fábricas construidas y operadas por [red]Arumis[].\nCon el tiempo se demostró que era muy difícil de mantener, algunas se perdieron por bestias que disparan sangre blanca.
facunit.message4 = El cierre masivo comenzó fábrica por fábrica, dejándolas ser engullidas por tormentas de arena,\ndesmoronarse y convertirse en montones de chatarra, deteriorarse lentamente o incluso ser infestadas.
facunit.message5 = Las únicas unidades de fábrica funcionales restantes son:\n[accent]#0047 - estado = [lightgray]cerrada\n[accent]#0072 - estado = [lightgray]no disponible
facunit.message6 = Hace años cuando las fábricas estaban activas,\n[red]Arumis[] entregaba equipo avanzado a aquellos que no podían construirlo ellos mismos.
facunit.message7 = Debido a que los [red]Arumis[] descuidaron este sector,\nno hay nada que te impida utilizar [accent]torretas[] para atacar la base.
facunit.message8 = [red]Arumis Junkyard [gray]#9344
facunit.message9 = [lightgray]Carga a reciclar: --73--\nCarga a incinerar: --107--\n\nConteo de recursos: 277%

bioweapon.document1 = Documento B-F-022: Las criaturas Barite poseen alta inteligencia, siendo capaces de ensamblar esquemas simples a algo complicados, su forma de comunicación parece incluir: gruñidos, ruidos de clic, aullidos y otros.
bioweapon.document2 = Documento B-F-197: Antes de que sus cuerpos consistieran en material radiactivo, estaban construidos como la mayoría de los mamíferos genéricos, con pelaje colorido, pelaje denso, extremidades fuertes, capacidad de ver en la oscuridad, colas largas y más delgadas
bioweapon.document3 = Documento B-F-767: El Proyecto [red]Bioweapon[] comienza en 10 días, las defensas están conteniendo bien a las criaturas barite, una vez que el arma biológica esté completa la horda mutada será erradicada una vez más
bioweapon.unavailable = [scarlet]Datos No Disponibles

acropolis.message = Documento de Acropolis #0980\nDebido a la ubicación extremadamente aislada, cualquier equipo viejo e inutilizable se envía a un vertedero

molten.message1 = Documento de Investigación #7988\nLas Criaturas Barite son seres fascinantes, al igual que cualquier criatura también son propensas a las peleas internas a pesar de vivir como una colmena y a veces para demostrar dominancia se aliarán con cualquier cosa o cualquiera.
molten.message2 = Documento de Investigación #8825\nHay muchas formas de domesticar una bestia salvaje en Asthosus, desde ofrecer recursos hasta ofrecer métodos para mostrar dominancia contra sus rivales.
molten.message3 = Documento de Investigación #9987\nA pesar de ser criaturas muy cooperativas, en el momento en que sus necesidades y objetivos se satisfacen abandonan completamente la relación y regresan a sus colmenas.

infernobastion.message1 = Documento 01: - Inferno Bastion recibió su nombre debido a la fuerte inundación de [orange]slag[] proveniente de [red]Molten Heights[] y debido al terreno que permite una fuerte fortificación y potencial de defensa sin fin.
infernobastion.message2 = Documento 02: - la mayor parte del terreno está recubierto con una capa de obsidiana resistente que permite que el slag mantenga su calor sin enfriarse demasiado rápido.
infernobastion.message3 = Documento 03: - Inferno Bastion o anteriormente conocido como "Inferno Archipelago" era un oasis floreciente con vegetación y habitado por #### o también conocidos como [red]Criaturas Barite[].
infernobastion.message4 = Documento 04: - Antes de ser inundado por slag, la temperatura en el área durante su era de oasis era de 1089°ATU (35°C) que era una temperatura adecuada para los habitantes locales y la vegetación.

nidus.message1 = Debido a los peligros de este sector, los [red]Arumis[] no lograron explorarlo adecuadamente.\nLos [red]Arumis[] han encontrado formas de poner pie sin alertar a los [gray]------
nidus.message2 = La base de datos del sector permanece como información altamente clasificada, hasta el día de hoy nada y nadie sabe qué hay en ella, dejando que la base de datos muestre "[red][Datos no disponibles][]"

