block.asthosus-04d-06-friction-quarry-large.details = Efecto de Potenciador: +20% velocidad de minado.
block.asthosus-04d-07-abrasion-quarry.details = Efecto de Potenciador: +30% velocidad de minado.
block.asthosus-04d-08-discharge-quarry.details = Efecto de Potenciador: +30% velocidad de minado.
block.asthosus-04d-10-decompression-extractor.details = Utiliza descomposición química para extraer elementos traza de matrices minerales. El SiF4 reacciona con silicatos para liberar y recomprimir materiales raros en formas usables. El conteo total de objetos aumenta debido a la recuperación de componentes traza ocultos, no a la duplicación de masa.

#Sectors - Campaign

sector.asthosus-19s-01-genesis.name = Genesis
sector.asthosus-19s-01-genesis.description = Aterrizas en Asthosus y te encuentras en un pequeño barranco desprovisto de vida y recursos.\n¿Realmente puedes conquistar este planeta?

sector.asthosus-19s-02-ignition.name = Ignition
sector.asthosus-19s-02-ignition.description = Pequeños depósitos de [accent]Lignite[] se han formado mediante actividad geotérmica.\n\nComienza a aventurarte en la energía eléctrica.

sector.asthosus-19s-03-lattice.name = Lattice
sector.asthosus-19s-03-lattice.description = Rocas dispersas de recursos salpican el área.\nImpide que el enemigo las aproveche.\nExpándete rápidamente.\nUtiliza [accent]Lodestone[] para defenderte de enemigos más fuertes.

sector.asthosus-19s-04-fulge.name = Fulge
sector.asthosus-19s-04-fulge.description = Aterrizas en un sector pequeño.\nEsta es la oportunidad perfecta para investigar y usar [accent]Lithium[].\n\nEstablece la producción de [accent]Lithium[]. Derriba al enemigo en este sector.\n\nUna poderosa tormenta geomagnética está causando estragos aquí.\nParece afectar tanto a ti como al enemigo.\n\n\n[blue]Modificadores:\n- Los enemigos infligen un 10% más de daño.\n- Los enemigos tienen un 25% más de salud.\n- Tus edificios tienen un 15% menos de salud.

sector.asthosus-19s-05-immist.name = Immist
sector.asthosus-19s-05-immist.description = El enemigo se ha atrincherado dentro de un área desierta.\n\nAl aterrizar, montarán un asalto.\nDefiende el núcleo del fuego enemigo.\n\nInvestiga tecnologías de producción de unidades.\nElimina el punto de apoyo enemigo.

sector.asthosus-19s-06-igneous-peaks.name = Igneous Peaks
sector.asthosus-19s-06-igneous-peaks.description = Este sector contiene biomas de alta temperatura.\nEstos contienen un nuevo recurso para que uses, [accent]Obsidian[].\n\nProduce [accent]Obsidian[] y úsalo para derribar al guardián de este sector.

sector.asthosus-19s-07-detriment-valley.name = Detriment Valley
sector.asthosus-19s-07-detriment-valley.description = Un sector que ha sobrevivido a muchos bombardeos.\nEl enemigo ha reunido una fuerza formidable aquí.\n\nAventúrate en la producción de [accent]Barite[].\n\nCrea defensas más fuertes.\nRepele al enemigo en este sector.\n\n\n[blue]Modificadores:\n- Los enemigos tienen un 15% más de salud.\n- Los enemigos infligen un 15% más de daño.\n- Los enemigos se mueven un 10% más rápido.

#Warning: Called Defringe in English!!!
sector.asthosus-19s-08-defringed-webbery.name = Defringe
sector.asthosus-19s-08-defringed-webbery.description = Un antiguo complejo de producción yace aquí, inactivo durante miles de años.\nActiva sus capacidades de auto-reparación. Utiliza [accent]Vesmonium[] para la defensa.\n\nNo te dejes engañar por el gran espaciado entre oleadas. Este es un sitio clave de interés enemigo.\n\nUtiliza las construcciones viejas y muertas dejadas después de cada intento fallido de asegurar un punto de apoyo.\nDerrota al poderoso guardián que protege este sector.\n\n\n[blue]Modificadores:\n- Los enemigos están equipados con un potenciador de velocidad. \n-Los Solar Heater Panels no están disponibles. \n-Desconstruir estructuras Derelict produce menos recursos.

sector.asthosus-19s-09-synthesis-facility.name = Synthesis Facility
sector.asthosus-19s-09-synthesis-facility.description = El enemigo se acerca desde dos lados al mismo tiempo.\n\nAventúrate en la creación de [accent]Crosium[].\nDefiende y captura este sector desafiante.

sector.asthosus-19s-10-furnace-settlement.name = Furnace Settlement
sector.asthosus-19s-10-furnace-settlement.description = El enemigo ha creado una base extremadamente poderosa aquí.\n\nAdemás, el enemigo está desplegando fuerzas desde dos zonas de aterrizaje al mismo tiempo.\nAlgunos de sus guardianes más poderosos han recibido la orden de detener tu campaña.\n\nAventúrate en la creación de [accent]Draysten[].\nDerriba las oleadas enemigas y destruye su masiva base.

sector.asthosus-19s-11-omega.name = Omega
sector.asthosus-19s-11-omega.description = La última y final frontera.\n\nEl enemigo ha reunido todas las fuerzas restantes y atacará sin piedad.\n\nPrepárate para luchar desde múltiples frentes al mismo tiempo.\n\nEl enemigo ha asegurado sus zonas de aterrizaje con una base masiva.\n\nDerriba esta base.\nPodría ser una buena idea asegurar primero tus propias zonas y \nproducción antes de lanzar tu ataque.

#Sectors - Optional

sector.asthosus-20t-01-maar.name = Maar
sector.asthosus-20t-01-maar.description = Te encuentras en un sector pequeño con mucha [accent]Oasis Water[].\n\nEste sector es perfecto para la producción de [accent]Lodestone[].\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-02-chasm.name = Chasm
sector.asthosus-20t-02-chasm.description = Este sector puede resultar útil para producción adicional de [accent]Lithium[].\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-02-e-clamor.name = Clamor
sector.asthosus-20t-02-e-clamor.description = Parece que este sector es rico en recursos.\n\nSe han avistado guardianes de nivel 5 de Arumis.\n\nElimínalos. Reclama este sector para ti.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-02-f-embage.name = Embag
sector.asthosus-20t-02-f-embage.description = Te encuentras en un sector muy estrecho y claustrofóbico.\n\nEl enemigo es implacable.\nRepele al enemigo bajo estas condiciones limitadas.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-02-d-inferate.name = Inferate
sector.asthosus-20t-02-d-inferate.description = Tropiezas con una gran base.\n\nDespués de capturar Immist te preguntas cuántas más bases enemigas tendrás que destruir.\n\nEl enemigo ha construido sus defensas en capas.\nDestrúyelas una por una.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-02-g-factory-unit-0047.name = Factory Unit 0047
sector.asthosus-20t-02-g-factory-unit-0047.description = Una masiva unidad de fábrica, \ndejada por los Arumis. \n\nEl complejo de producción yace abandonado, \nla mayoría de las instalaciones de defensa se han deteriorado. \n\nEl enemigo está desatento. \n\n\n[blue]Modificadores: \n- Puedes usar torretas para atacar la base enemiga. \n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-03-a-magmatic-riverbed.name = Magmatic Riverbed
sector.asthosus-20t-03-a-magmatic-riverbed.description = Un lecho de río de slag de gran alcance se encuentra aquí.\nCantidades gigantescas de actividad volcánica resultaron en un terreno accidentado \nque hace inútiles a la mayoría de las unidades.\n\nEl enemigo ha erigido aquí una base grande y fuertemente protegida.\n\n\n[blue]Modificadores:\n- Solo se pueden usar unidades hover.\n- Las estructuras enemigas tienen el doble de puntos de vida.\n- Los enemigos infligen un 50% más de daño.\n- Tus estructuras tienen un 20% más de puntos de vida.\n- Construyes un 50% más rápido.\n- Tu producción de unidades es un 25% más lenta.\n- Solo puedes depositar objetos en el núcleo.\n- Las estructuras minadas no devuelven materiales. \n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-03-barite-valley.name = Barite Valley
sector.asthosus-20t-03-barite-valley.description = Te encuentras en un sector inexplorado.\nEste sector parece ser el hogar de extrañas criaturas mutadas.\nParecen ser orgánicas de alguna manera.\n\nSobrevive a las oleadas de mutantes. Asegura un punto de apoyo.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-03-c-lucila.name = Lucila
sector.asthosus-20t-03-c-lucila.description = Justo cuando investigaste la tecnología para Barite, \nesta es robada por el enemigo.\n\nUsa Barite Coolers para fabricar Barite.\nCrea unidades de nivel superior para destruir la base enemiga.\n\n\n[blue]\n- Los Barite Querns no están disponibles.\n- Usa Barite Coolers para fabricar Barite.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-04-bioweapon-facility.name = Bioweapon Facility
sector.asthosus-20t-04-bioweapon-facility.description = Una gran instalación de investigación que ha sido tomada por Criaturas Barite.\nUna vez contuvo armas biológicas peligrosas.\n\nAhora los enjambres controlan toda la base.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-04-c-oasis-delta.name = Oasis Delta
sector.asthosus-20t-04-c-oasis-delta.description = Separado por un enorme río de Oasis Water yace aquí un área prístina separada de una masiva base enemiga.\n\nUsa Vesmonium para fabricar unidades de alto nivel.\nDestruye esta base.\n\nEl enemigo contraatacará con toda su fuerza.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-04-d-preciptum.name = Preciptum
sector.asthosus-20t-04-d-preciptum.description = Una vez una enorme área usada para pruebas de armas. \n\nUna gran parte del terreno de este sector fue transformada por una enorme \nexplosión en un vacío abismal. \n\nEl enemigo ha construido una base en los restos de esta tierra. \n\nDestrúyela. \n\n\n[blue]Modificadores: \n-Las unidades enemigas infligen un 50% más de daño. \n- Las estructuras enemigas tienen un 50% más de puntos de vida. \n- Tu producción de unidades es un 50% más lenta. \n- Hay Niebla de Guerra aquí. \n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-05-abandoned-research-center.name = Abandoned Research Center
sector.asthosus-20t-05-abandoned-research-center.description = El enemigo ha creado una poderosa base con múltiples núcleos.\nSe requieren unidades de niveles superiores para destruirla.\n\nActúa rápido. Expándete rápidamente.\nDestruye la base enemiga antes de que sus unidades te destruyan a ti. \n\n\n[blue]Modificadores: \n- Las unidades enemigas infligen un 15% más de daño. \n- Las estructuras enemigas tienen un 25% más de puntos de vida. \n- Las estructuras enemigas infligen un 25% más de daño. \n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-05-b-thanatos.name = Thanatos
sector.asthosus-20t-05-b-thanatos.description = Un sector remoto que, en relación a su tamaño, tiene grandes cantidades de recursos.\n\nLa presencia enemiga es débil. ¿O lo es?\n\nRepele hordas de enemigos y guardianes.\nToma este sector para ti.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-05-c-caldoria.name = Caldoria
sector.asthosus-20t-05-c-caldoria.description = Los escaneos indican que este sector no contiene [accent]Crystalline Geodes[].\n\nLa fuerza enemiga no se puede calcular.\n\nToma este sector para ti.\n\n\n[blue]Modificadores:\n- No hay Crystalline Geodes presentes.\n- Usa Slag Cooling Molds para crear Obsidian.\n- La tecnología de bajo nivel no se puede usar aquí.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-06-molten-heights.name = Molten Heights
sector.asthosus-20t-06-molten-heights.description = Gracias a cantidades masivas de actividad volcánica toda la región está inundada de slag.\nLas áreas de terreno más elevadas permanecen intactas.\n\nEl enemigo ve un alto valor en este sector. Prepárate para oleadas implacables.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-06-n-mune.name = Mune
sector.asthosus-20t-06-n-mune.description = Se han enviado unidades equipadas con generadores de escudo superreforzados para detenerte.\n\nDefiéndete usando tus armas más poderosas.\n\n\n[blue]Modificadores:\n- Los enemigos infligen un 25% más de daño de todas las fuentes.\n- Los enemigos poseen un múltiplo de sus puntos de vida como escudos.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-06-o-inferno-bastion.name = Inferno Bastion
sector.asthosus-20t-06-o-inferno-bastion.description = Esta área es rica en recursos debido a la alta actividad volcánica,\nlo que causó que el sector se inundara con masas de slag.\n\nLos enemigos se asentaron aquí hace mucho tiempo, pero fueron tomados por las Criaturas Barite.\n\nRecupera la base de estas criaturas,\nmientras evitas la masa fundida y construyes tu infraestructura a su alrededor.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-06-p-nidus.name = Nidus
sector.asthosus-20t-06-p-nidus.description = Una i_ntelige_ncia pe_ligrosa p_rece es_ar reu_iendo una ca_tidad i_creíble de cri_turas bar_te aq_í, se reco_ienda \n- \n[red]Transmisión perdida, datos no disponibles. \n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-07-finistera.name = Finistera
sector.asthosus-20t-07-finistera.description = Aterrizas en un sector claustrofóbico.\nEl enemigo ha reconocido un gran valor en este sector.\n\nAtacan desde 4 direcciones.\nAlgunas zonas de aterrizaje se activarán después de algún tiempo.\nOtras están activas todo el tiempo.\n\nTambién hay una gran cantidad de Criaturas Barite aquí.\nDestruye sus colmenas.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

sector.asthosus-20t-08-acropolis.name = Acropolis
sector.asthosus-20t-08-acropolis.description = Tropiezas con un sector de forma extraña.\n\nEl enemigo ha erigido aquí, con diferencia, la base más fuerte que hayas visto.\n\nDestrúyela. Se necesitarán unidades de alto nivel.\n\nParece que la base está construida en etapas.\nQuizás deberías destruir las etapas una por una empezando por la más débil.\n\nConsidera asegurar el espacio limitado que tienes disponible antes de atacar.\n\nExpándete tanto como puedas.\n\n\n[accent]Nota: Este es un sector opcional. Capturarlo no es requerido para completar la campaña.

# ============================================
# ITEMS (Objetos)
# Nombres originales mantenidos + descripciones en español
# ============================================

item.asthosus-01a-01-item-ferrinite.name = Ferrinite
item.asthosus-01a-01-item-ferrinite.description = Un material similar a la piedra. Parece ser arena o piedra endurecida. Se usa en construcciones simples.

item.asthosus-01a-02-item-demetite.name = Demetite
item.asthosus-01a-02-item-demetite.description = Un recurso metálico utilizado en construcciones simples.

item.asthosus-01a-03-item-lignite.name = Lignite
item.asthosus-01a-03-item-lignite.description = Un material similar al carbón que se puede usar para combustión y calor.

item.asthosus-01a-04-item-hardened-sand.name = Hardened Sand
item.asthosus-01a-04-item-hardened-sand.description = Arena que ha sido comprimida por el calor. Se usa para fabricar recursos simples.

item.asthosus-01a-05-item-red-sand.name = Red Sand
item.asthosus-01a-05-item-red-sand.description = Arena de un bioma tipo mesa. Contiene rastros de diversos materiales.

item.asthosus-01a-06-item-lodestone.name = Lodestone
item.asthosus-01a-06-item-lodestone.description = Una piedra magnética utilizada en la producción de unidades y construcciones más avanzadas.

item.asthosus-01a-07-item-lithium.name = Lithium
item.asthosus-01a-07-item-lithium.description = Un material que se usa frecuentemente en electrónica.

item.asthosus-01a-08-item-cretite.name = Cretite
item.asthosus-01a-08-item-cretite.description = Un material compuesto altamente inflamable y ligeramente explosivo hecho de Lignite, Lithium y Red Sand.

item.asthosus-01a-08-j-item-crystalline-geode.name = Crystalline Geode
item.asthosus-01a-08-j-item-crystalline-geode.description = Cristales de obsidiana cubiertos por gruesas capas de Ferrinite. Debe romperse para obtener Obsidian usable.

item.asthosus-01a-09-item-obsidian.name = Obsidian
item.asthosus-01a-09-item-obsidian.description = Se usa en construcciones avanzadas. No se puede minar directamente; debe obtenerse rompiendo Crystalline Geodes o enfriando slag.

item.asthosus-01a-10-item-irradiated-lump.name = Irradiated Lump
item.asthosus-01a-10-item-irradiated-lump.description = Un mineral radiactivo que por sí solo no tiene utilidad, pero puede procesarse para obtener Barite.

item.asthosus-01a-11-item-barite.name = Barite
item.asthosus-01a-11-item-barite.description = Un mineral radiactivo usado en construcciones avanzadas, generación de energía y fabricación.

item.asthosus-01a-12-item-crosium.name = Crosium
item.asthosus-01a-12-item-crosium.description = Se usa en construcciones avanzadas y creación de unidades. Tiene una estructura peculiar que le permite ser tanto aislante como conductor eléctrico según el método de uso.

item.asthosus-01a-13-item-barite-webbing.name = Vesmonium
item.asthosus-01a-13-item-barite-webbing.description = Un material ligeramente cargado e inflamable. Se usa en construcciones avanzadas, defensas y fabricación avanzada.

item.asthosus-01a-14-item-draysten.name = Draysten
item.asthosus-01a-14-item-draysten.description = Una aleación ligeramente cargada e inflamable usada en construcciones muy avanzadas y producción de unidades. Se fabrica a partir de Vesmonium bajo calor y presión.

# ============================================
# UNITS (Unidades)
# Nombres originales mantenidos + descripciones en español
# ============================================

# Ground units (Shiv line)
unit.asthosus-14n-01-shiv.name = Shiv
unit.asthosus-14n-01-shiv.description = Dispara cuchillas de energía eléctrica a objetivos cercanos. Puede recorrer cortas distancias con un dash. Fuerte en grupos, débil contra unidades individuales.

unit.asthosus-14n-02-bayonet.name = Bayonet
unit.asthosus-14n-02-bayonet.description = Lanza artillería fragmentaria a objetivos cercanos. Equipado con un lanzamisiles.

unit.asthosus-14n-03-cleaver.name = Cleaver
unit.asthosus-14n-03-cleaver.description = Usa una ametralladora gatling para atacar objetivos enemigos. Equipado con un lanzaminas eléctrico.

unit.asthosus-14n-04-apex.name = Apex
unit.asthosus-14n-04-apex.description = Dispara arpones a los enemigos así como cargas de flak.

unit.asthosus-14n-05-crest.name = Crest
unit.asthosus-14n-05-crest.description = Dispara artillería de choque en racimo a los enemigos. Equipado con cañones duales.

# Tank units (Shennong line)
unit.asthosus-15o-01-shennong.name = Shennong
unit.asthosus-15o-01-shennong.description = Dispara rayos de energía de choque a los enemigos.

unit.asthosus-15o-02-trigon.name = Trigon
unit.asthosus-15o-02-trigon.description = Rápido y blindado. Equipado con un lanzamisiles.

unit.asthosus-15o-03-aprotodon.name = Aprotodon
unit.asthosus-15o-03-aprotodon.description = Rápido y blindado. Equipado con un cañón de riel de rayos.

unit.asthosus-15o-04-aphelops.name = Aphelops
unit.asthosus-15o-04-aphelops.description = Equipado con un cañón de fragmentación perforante, así como ametralladoras y lanzadores eléctricos.

unit.asthosus-15o-05-annectodon.name = Annectodon
unit.asthosus-15o-05-annectodon.description = Equipado con un poderoso cañón disruptor.

# Hover units
unit.asthosus-16a-01-parave.name = Parave
unit.asthosus-16a-01-parave.description = Dispara misiles teledirigidos a los enemigos. No puede cruzar terreno.

unit.asthosus-16a-02-teraze.name = Teraze
unit.asthosus-16a-02-teraze.description = Dispara proyectiles teledirigidos a los enemigos. No puede cruzar terreno.

unit.asthosus-16a-03-decredence.name = Decredence
unit.asthosus-16a-03-decredence.description = Dispara proyectiles y misiles teledirigidos a los enemigos. No puede cruzar terreno.

unit.asthosus-16a-04-tequant.name = Tequant
unit.asthosus-16a-04-tequant.description = Además de pequeños misiles, dispara un rayo globular lento a los enemigos que causa alto daño. No puede cruzar terreno.

unit.asthosus-16a-05-everse.name = Everse
unit.asthosus-16a-05-everse.description = Además de enjambres de misiles, dispara una carga de proyectiles de cañón de riel perforantes a los enemigos. No puede cruzar terreno.

# Support units
unit.asthosus-16p-01-luminary.name = Luminary
unit.asthosus-16p-01-luminary.description = Puede construir y reparar estructuras dañadas. Equipado con un pequeño rayo curativo.

unit.asthosus-16p-02-enlighten.name = Enlighten
unit.asthosus-16p-02-enlighten.description = Puede construir y reparar estructuras dañadas. Ayuda a otras unidades a construir. Equipado con un rayo curativo y un cañón de arco eléctrico.

unit.asthosus-16p-03-illuminate.name = Illuminate
unit.asthosus-16p-03-illuminate.description = Puede construir y reparar estructuras dañadas. Equipado con artillería y cañones curativos.

unit.asthosus-16p-04-elucidate.name = Elucidate
unit.asthosus-16p-04-elucidate.description = Puede construir y reparar estructuras dañadas. Equipado con artillería dual y cañones curativos. Proyecta un escudo para proteger a las unidades aliadas cercanas.

unit.asthosus-16p-05-expound.name = Expound
unit.asthosus-16p-05-expound.description = Puede construir y reparar estructuras dañadas. Equipado con un lanzador curativo, un array de láseres curativos perforantes y dos lanzamisiles.

# ============================================
# BLOCKS - Turrets (Torretas)
# ============================================

block.asthosus-03c-01-catapult.name = Catapult
block.asthosus-03c-01-catapult.description = Dispara una andanada de pequeñas balas de artillería a enemigos a media distancia.

block.asthosus-03c-02-spray.name = Spray
block.asthosus-03c-02-spray.description = Una pequeña torreta hecha de Ferrinite. Se usa para defender estructuras aliadas. Dispara ráfagas de proyectiles a los enemigos.

block.asthosus-03c-03-singe.name = Singe
block.asthosus-03c-03-singe.description = Dispara un chorro continuo de llamas a los enemigos. Muy efectivo a corta distancia.

block.asthosus-03c-15-typhoon.name = Typhoon
block.asthosus-03c-15-typhoon.description = Dispara proyectiles rápidamente a los enemigos. Especializado en lidiar frontalmente con enemigos individuales. Menos eficiente contra enjambres.

block.asthosus-03c-16-concite.name = Concite
block.asthosus-03c-16-concite.description = Dispara alternadamente poderosos disparos a los enemigos y los perfora. Especializado en destruir enjambres. Menos eficiente contra objetivos individuales.

block.asthosus-03c-17-tralux.name = Tralux
block.asthosus-03c-17-tralux.description = Dispara un rayo continuo y fracturante de energía pura a los enemigos. Los enemigos alcanzados quedan irradiados.

block.asthosus-03c-18-verite.name = Verite
block.asthosus-03c-18-verite.description = Una torreta de alta precisión y gran alcance. Dispara proyectiles perforantes a los enemigos. Requiere presión.

block.asthosus-03c-19-missile-battery.name = Komedit
block.asthosus-03c-19-missile-battery.description = Usa Vesmonium o Draysten como munición para disparar rápidas salvas de misiles a los enemigos.

block.asthosus-03c-20-draysten-mortar.name = Prejekt
block.asthosus-03c-20-draysten-mortar.description = Una poderosa torreta que dispara balas de artillería a gran alcance que explotan con fuerza. Requiere presión.

# ============================================
# BLOCKS - Mining & Production
# ============================================

block.asthosus-04d-01-ferrinite-mining-unit.name = Ferrinite Mining Unit
block.asthosus-04d-01-ferrinite-mining-unit.description = Extrae lentamente Ferrinite de las paredes de Ferrinite. No funciona en paredes de Ferrinite envejecidas.

block.asthosus-04d-02-demetite-mining-unit.name = Demetite Mining Unit
block.asthosus-04d-02-demetite-mining-unit.description = Extrae lentamente Demetite de las paredes de Demetite. No funciona en paredes de Demetite envejecidas.

block.asthosus-04d-03-ferrinite-crusher.name = Ferrinite Crusher
block.asthosus-04d-03-ferrinite-crusher.description = Extrae Ferrinite de las paredes de Ferrinite. Requiere presión. Es más eficiente que una Ferrinite Mining Unit normal.

block.asthosus-04d-04-demetite-crusher.name = Demetite Crusher
block.asthosus-04d-04-demetite-crusher.description = Extrae Demetite de las paredes de Demetite. Requiere presión. Es más eficiente que una Demetite Mining Unit normal.

block.asthosus-04d-05-friction-quarry.name = Friction Quarry
block.asthosus-04d-05-friction-quarry.description = Usa pequeñas explosiones de fricción para extraer materiales simples del suelo.
block.asthosus-04d-05-friction-quarry.details = Efecto de Potenciador: +20% velocidad de minado.

block.asthosus-04d-06-friction-quarry-large.name = Large Friction Quarry
block.asthosus-04d-06-friction-quarry-large.description = Versión más grande y eficiente del Friction Quarry. Puede extraer materiales más avanzados.
block.asthosus-04d-06-friction-quarry-large.details = Efecto de Potenciador: +20% velocidad de minado.

block.asthosus-04d-07-abrasion-quarry.name = Abrasion Quarry
block.asthosus-04d-07-abrasion-quarry.description = Cantera avanzada capaz de extraer Barite y otros materiales radiactivos.
block.asthosus-04d-07-abrasion-quarry.details = Efecto de Potenciador: +30% velocidad de minado.

block.asthosus-04d-08-discharge-quarry.name = Discharge Quarry
block.asthosus-04d-08-discharge-quarry.description = Cantera de alto nivel que utiliza descargas eléctricas para extraer materiales.
block.asthosus-04d-08-discharge-quarry.details = Efecto de Potenciador: +30% velocidad de minado.

block.asthosus-04d-10-decompression-extractor.name = Decompression Extractor
block.asthosus-04d-10-decompression-extractor.description = Utiliza descomposición química para extraer elementos traza de matrices minerales. El SiF4 reacciona con silicatos para liberar y recomprimir materiales raros en formas usables. El conteo total de objetos aumenta debido a la recuperación de componentes traza ocultos, no a la duplicación de masa.
block.asthosus-04d-10-decompression-extractor.details = Utiliza descomposición química para extraer elementos traza de matrices minerales. El SiF4 reacciona con silicatos para liberar y recomprimir materiales raros en formas usables. El conteo total de objetos aumenta debido a la recuperación de componentes traza ocultos, no a la duplicación de masa.


# ============================================
# BLOCKS - Logistics (Transporte de objetos)
# ============================================

block.asthosus-05e-01-ferrinite-duct.name = Ferrinite Pipeline
block.asthosus-05e-01-ferrinite-duct.description = Transporta objetos usando presión negativa.

block.asthosus-05e-02-transverse-duct.name = Transverse Pipeline
block.asthosus-05e-02-transverse-duct.description = Transporta objetos usando fuerza magnética.

block.asthosus-05e-03-crosium-conveyor.name = Crosium Conveyor
block.asthosus-05e-03-crosium-conveyor.description = Empaqueta pilas de objetos antes de enviarlos. Distribuye los objetos al final de forma equitativa en tres direcciones.

block.asthosus-05e-04-ferrinite-duct-router.name = Pipeline Router
block.asthosus-05e-04-ferrinite-duct-router.description = Hecho de Ferrinite. Distribuye los objetos entrantes de forma equitativa en tres direcciones de salida.

block.asthosus-05e-04-g-ferrinite-duct-distributor.name = Large Pipeline Distributor
block.asthosus-05e-04-g-ferrinite-duct-distributor.description = Un distribuidor de pipeline más grande. Distribuye los objetos entrantes de forma equitativa en 7 direcciones de salida.

block.asthosus-05e-05-ferrinite-duct-junction.name = Pipeline Junction
block.asthosus-05e-05-ferrinite-duct-junction.description = Permite cruzar dos pipelines.

block.asthosus-05e-06-ferrinite-duct-bridge.name = Ferrinite Pipeline Bridge
block.asthosus-05e-06-ferrinite-duct-bridge.description = Funciona como puente para cruzar pipelines o terreno.

block.asthosus-05e-07-duct-sorter.name = Pipeline Sorter
block.asthosus-05e-07-duct-sorter.description = Si un objeto entrante coincide con la selección, continúa recto. De lo contrario, se desvía hacia los lados.

block.asthosus-05e-08-duct-sorter-inverted.name = Inverted Pipeline Sorter
block.asthosus-05e-08-duct-sorter-inverted.description = Funciona como un Pipeline Sorter normal pero de forma invertida.

block.asthosus-05e-09-overflow-controller.name = Overflow Gate
block.asthosus-05e-09-overflow-controller.description = Desvía objetos hacia los lados cuando el camino frontal está bloqueado.

block.asthosus-05e-09-p-underflow-controller.name = Underflow Gate
block.asthosus-05e-09-p-underflow-controller.description = Funciona como un Overflow Gate pero de forma invertida.

block.asthosus-05e-10-heavy-unloader.name = Heavy Unloader
block.asthosus-05e-10-heavy-unloader.description = Un descargador direccional que no puede descargar núcleos.

block.asthosus-05e-10-i-kinetic-propulsor.name = Kinetic Propulsor
block.asthosus-05e-10-i-kinetic-propulsor.description = Dispara pilas de objetos a media distancia hacia un Kinetic Propulsor conectado. Requiere energía.

block.asthosus-05e-11-unit-cargo-base-station.name = Cargo Base Station
block.asthosus-05e-11-unit-cargo-base-station.description = Carga una dron de carga con objetos para enviarlos a un Cargo Drop Point conectado.

block.asthosus-05e-12-unit-cargo-drop-point.name = Cargo Drop Point
block.asthosus-05e-12-unit-cargo-drop-point.description = Acepta objetos lanzados por un dron de carga Alveus.

block.asthosus-05e-13-heat-distributor.name = Heat Distributor
block.asthosus-05e-13-heat-distributor.description = Transfiere calor a otros distribuidores de calor o consumidores de calor.

# ============================================
# BLOCKS - Liquids (Fluidos)
# ============================================

block.asthosus-06f-01-aqueduct.name = Aqueduct
block.asthosus-06f-01-aqueduct.description = Transporta líquidos.

block.asthosus-06f-01-b-viaduct.name = Viaduct
block.asthosus-06f-01-b-viaduct.description = Un Aqueduct con más puntos de vida y mayor velocidad, hecho de Obsidian.

block.asthosus-06f-02-aqueduct-junction.name = Aqueduct Junction
block.asthosus-06f-02-aqueduct-junction.description = Se usa para cruzar dos Aqueducts.

block.asthosus-06f-03-aqueduct-router.name = Aqueduct Router
block.asthosus-06f-03-aqueduct-router.description = Distribuye los líquidos entrantes de forma equitativa en tres direcciones de salida.

block.asthosus-06f-04-aqueduct-bridge.name = Aqueduct Bridge
block.asthosus-06f-04-aqueduct-bridge.description = Se usa para cruzar varias líneas de distribución o terreno con Aqueducts.

block.asthosus-06f-05-lodestone-pump.name = Lodestone Pump
block.asthosus-06f-05-lodestone-pump.description = Bombee líquidos lentamente desde campos de líquidos.

block.asthosus-06f-06-exothermic-pump.name = Exothermic Pump
block.asthosus-06f-06-exothermic-pump.description = Bombee líquidos desde campos de líquidos.

block.asthosus-06f-07-oasis-water-sieve.name = Oasis Water Sieve
block.asthosus-06f-07-oasis-water-sieve.description = Purifica Oasis Water para crear Purified Oasis Water.

block.asthosus-06f-07-p-oasis-water-griddle.name = Oasis Water Griddle
block.asthosus-06f-07-p-oasis-water-griddle.description = Purifica Oasis Water usando Red Sand para crear Purified Oasis Water. Es más eficiente que un Oasis Water Sieve normal.

block.asthosus-06f-08-liquid-vat.name = Liquid Vat
block.asthosus-06f-08-liquid-vat.description = Almacena líquidos.

# ============================================
# BLOCKS - Power & Heat (Energía y Calor)
# ============================================

block.asthosus-09i-12-pressure-rig.name = Pressure Rig
block.asthosus-09i-12-pressure-rig.description = Utiliza la presión de fuentes geotérmicas y la pone a disposición.

block.asthosus-09i-13-expansion-tank.name = Expansion Tank
block.asthosus-09i-13-expansion-tank.description = Usa calor para generar presión.

block.asthosus-09i-14-large-expansion-tank.name = Large Expansion Tank
block.asthosus-09i-14-large-expansion-tank.description = Usa calor para generar presión. Genera presión más rápido y de forma más eficiente que un Expansion Tank normal.

block.asthosus-09i-15-lignite-burner.name = Lignite Burner
block.asthosus-09i-15-lignite-burner.description = Quema Lignite inflamable para producir calor y distribuirlo equitativamente hacia todos los lados.

block.asthosus-09i-16-cretite-etna.name = Cretite Etna
block.asthosus-09i-16-cretite-etna.description = Quema Cretite altamente inflamable para generar calor. Es más eficiente que un Lignite Burner. Distribuye el calor generado equitativamente hacia todos los lados.

block.asthosus-09i-17-solar-heater-panel.name = Solar Heater Panel
block.asthosus-09i-17-solar-heater-panel.description = Produce pasivamente pequeñas cantidades de calor y energía.

# ============================================
# BLOCKS - Advanced Production
# ============================================

block.asthosus-09i-07-barite-cooler.name = Barite Cooler
block.asthosus-09i-07-barite-cooler.description = Enfría Liquid Barite usando Oasis Water para crear Barite.

block.asthosus-09i-08-crosium-infuser.name = Crosium Infuser
block.asthosus-09i-08-crosium-infuser.description = Infunde Obsidian con Purified Oasis Water y lo comprime para crear Crosium. Requiere energía y presión.

block.asthosus-09i-09-barite-loom.name = Vesmonium Accumulator
block.asthosus-09i-09-barite-loom.description = Crea Vesmonium a partir de Barite y Lignite. Requiere energía y presión. Funciona mejor sobre campos de Barite.

block.asthosus-09i-10-draysten-crucible.name = Draysten Crucible
block.asthosus-09i-10-draysten-crucible.description = Crea Draysten a partir de Vesmonium y Nontragen. Requiere calor y energía.

block.asthosus-09i-11-nontragen-synthesizer.name = Nontragen Synthesizer
block.asthosus-09i-11-nontragen-synthesizer.description = Muele Obsidian hasta convertirlo en polvo de Obsidian y lo presuriza con Oasis Water para generar Nontragen.

block.asthosus-09i-18-red-sand-filter.name = Red Sand Filter
block.asthosus-09i-18-red-sand-filter.description = Filtra Red Sand usando Oasis Water para producir pequeñas cantidades de Sand, Ferrinite, Demetite y Lignite. También produce Purified Oasis Water. Requiere presión.

# ============================================
# BLOCKS - Unit Production
# ============================================

block.asthosus-10j-00-ground-mounting-bay.name = Ground Assembly Bay
block.asthosus-10j-00-ground-mounting-bay.description = Ensambla unidades terrestres a partir de componentes.

block.asthosus-10j-01-tank-mounting-bay.name = Tank Assembly Bay
block.asthosus-10j-01-tank-mounting-bay.description = Ensambla unidades tipo tanque a partir de componentes.

block.asthosus-10j-02-support-mounting-bay.name = Support Assembly Bay
block.asthosus-10j-02-support-mounting-bay.description = Ensambla unidades de soporte a partir de componentes.

block.asthosus-10j-03-hover-mounting-bay.name = Hover Assembly Bay
block.asthosus-10j-03-hover-mounting-bay.description = Ensambla unidades hover a partir de componentes.

block.asthosus-10j-04-basic-assembler-constituent.name = Basic Assembler Constituent
block.asthosus-10j-04-basic-assembler-constituent.description = Permite la construcción de unidades de nivel 2 cuando se coloca adyacente a un Assembly Bay.

block.asthosus-10j-05-advanced-assembler-constituent.name = Advanced Assembler Constituent
block.asthosus-10j-05-advanced-assembler-constituent.description = Permite la construcción de unidades de nivel 3 cuando se coloca adyacente a un Assembly Bay (requiere también el Basic).

block.asthosus-10j-06-progressive-assembler-constituent.name = Progressive Assembler Constituent
block.asthosus-10j-06-progressive-assembler-constituent.description = Permite la construcción de unidades de nivel 4 cuando se coloca adyacente a un Assembly Bay.

block.asthosus-10j-07-cumulative-assembler-constituent.name = Cumulative Assembler Constituent
block.asthosus-10j-07-cumulative-assembler-constituent.description = Permite la construcción de unidades de nivel 5 cuando se coloca adyacente a un Assembly Bay.

block.asthosus-10j-09-component-assembler.name = Component Assembler
block.asthosus-10j-09-component-assembler.description = Fabrica componentes básicos necesarios para las unidades.

block.asthosus-10j-10-rudimentary-component-assembler.name = Rudimentary Component Assembler
block.asthosus-10j-10-rudimentary-component-assembler.description = Fabrica componentes de nivel inferior.

block.asthosus-10j-11-median-component-assembler.name = Median Component Assembler
block.asthosus-10j-11-median-component-assembler.description = Fabrica componentes de nivel medio.

block.asthosus-10j-12-progressive-component-assembler.name = Progressive Component Assembler
block.asthosus-10j-12-progressive-component-assembler.description = Fabrica componentes de nivel avanzado.

block.asthosus-10j-13-cumulative-component-assembler.name = Cumulative Component Assembler
block.asthosus-10j-13-cumulative-component-assembler.description = Fabrica los componentes de más alto nivel.

block.asthosus-10j-08-component-disassembler.name = Component Disassembler
block.asthosus-10j-08-component-disassembler.description = Desmonta componentes de unidades para recuperar materiales.

block.asthosus-10j-16-unit-resynthesizer.name = Unit Resynthesizer
block.asthosus-10j-16-unit-resynthesizer.description = Repara y regenera unidades dañadas.


# ============================================
# BLOCKS - Power System (Sistema de energía)
# ============================================

block.asthosus-07g-01-ferrinite-wire.name = Ferrinite Wire
block.asthosus-07g-01-ferrinite-wire.description = Conduce energía al colocarse junto a más cables. Puede almacenar cantidades muy pequeñas de energía.

block.asthosus-07g-02-reinforced-wire.name = Reinforced Wire
block.asthosus-07g-02-reinforced-wire.description = Conduce energía al colocarse junto a más cables. Almacena más energía y tiene significativamente más puntos de vida que un cable normal.

block.asthosus-07g-03-rectifier.name = Rectifier
block.asthosus-07g-03-rectifier.description = Mueve la energía de las baterías en una sola dirección, pero solo si el otro lado tiene menos energía almacenada.

block.asthosus-07g-04-network-terminal.name = Network Terminal
block.asthosus-07g-04-network-terminal.description = Se conecta a los cables para mostrar el flujo de energía actual y la cantidad de energía almacenada.

block.asthosus-07g-05-connector-node.name = Connector Node
block.asthosus-07g-05-connector-node.description = Conecta cables a través de pequeñas distancias sin que estos tengan que estar directamente unidos. Una puente de cables.

block.asthosus-07g-06-power-cell.name = Power Cell
block.asthosus-07g-06-power-cell.description = Una celda de energía simple hecha para almacenar energía.

block.asthosus-07g-06-q-voltage-capacitator.name = Voltage Capacitor
block.asthosus-07g-06-q-voltage-capacitator.description = Un capacitor capaz de almacenar mayores cantidades de energía que una Power Cell normal.

block.asthosus-07g-07-ignition-generator.name = Ignition Generator
block.asthosus-07g-07-ignition-generator.description = Quema materiales inflamables para generar pequeñas cantidades de energía.

block.asthosus-07g-08-pressure-turbine.name = Pressure Turbine
block.asthosus-07g-08-pressure-turbine.description = Utiliza presión para generar mayores cantidades de energía.

block.asthosus-07g-09-cretite-turbine.name = Cretite Turbine
block.asthosus-07g-09-cretite-turbine.description = Genera cantidades medias de energía quemando Cretite inflamable. Usa Purified Oasis Water como refrigerante.

block.asthosus-07g-10-discharge-generator.name = Discharge Generator
block.asthosus-07g-10-discharge-generator.description = Produce energía descargando materiales cargados. Acumula presión lentamente y explota si la presión alcanza el límite superior.

block.asthosus-07g-11-radiation-power-plant.name = Radiation Power Plant
block.asthosus-07g-11-radiation-power-plant.description = Un reactor que utiliza materiales radiactivos para generar grandes cantidades de energía.

# ============================================
# BLOCKS - Cores & Storage
# ============================================

block.asthosus-11k-01-core-essence.name = Core: Essence
block.asthosus-11k-01-core-essence.description = Núcleo de la base. El núcleo inicial. Almacena una cantidad moderada de objetos.

block.asthosus-11k-02-core-petra.name = Core: Petra
block.asthosus-11k-02-core-petra.description = Núcleo de la base. Mejor blindado que Essence. Permite más unidades activas.

block.asthosus-11k-03-core-substratum.name = Core: Substratum
block.asthosus-11k-03-core-substratum.description = Núcleo de la base. Bien blindado y capaz de almacenar grandes cantidades de objetos. Permite más unidades activas que un núcleo Petra.

block.asthosus-11k-04-core-omphalos.name = Core: Omphalos
block.asthosus-11k-04-core-omphalos.description = Núcleo de la base. Muy bien blindado y capaz de almacenar grandes cantidades de objetos.

block.asthosus-11k-05-core-silex.name = Core: Silex
block.asthosus-11k-05-core-silex.description = Núcleo de la base. Bien blindado y capaz de almacenar grandes cantidades de objetos. Permite más unidades activas que un núcleo Substratum.

block.asthosus-11k-06-core-summit.name = Core: Summit
block.asthosus-11k-06-core-summit.description = Núcleo de la base. Increíblemente bien blindado y capaz de almacenar cantidades enormes de objetos. Permite más unidades activas que un núcleo Omphalos.

block.asthosus-11k-07-storage-capsule.name = Storage Capsule
block.asthosus-11k-07-storage-capsule.description = Almacena objetos en mayores cantidades. Frágil.

block.asthosus-11k-08-explosive-mine.name = Explosive Mine
block.asthosus-11k-08-explosive-mine.description = Explota cuando los enemigos pisan sobre ella y causa un daño relativamente alto.

# ============================================
# BLOCKS - Projectors & Defense Support
# ============================================

block.asthosus-11k-09-barrier-projector.name = Barrier Projector
block.asthosus-11k-09-barrier-projector.description = Crea un escudo cuadrado al ser alimentado con energía para proteger estructuras y unidades aliadas del daño. Opcionalmente puede reforzarse con Vesmonium.

block.asthosus-11k-10-restoration-projector.name = Restoration Projector
block.asthosus-11k-10-restoration-projector.description = Repara lentamente los bloques aliados cercanos. Requiere energía. Opcionalmente puede reforzarse con Lithium. La curación no se acumula.

block.asthosus-11k-11-restoration-dome.name = Restoration Dome
block.asthosus-11k-11-restoration-dome.description = Repara lentamente los bloques aliados cercanos. Requiere energía. Tiene más alcance que un Restoration Projector normal y restaura puntos de vida más rápido. Opcionalmente puede reforzarse con Vesmonium. La curación no se acumula.

# ============================================
# BLOCKS - Logic
# ============================================

block.asthosus-12l-01-logic-chip.name = Logic Chip
block.asthosus-12l-01-logic-chip.description = Ejecuta instrucciones de lógica. Puede controlar unidades y edificios.

block.asthosus-12l-02-logic-control.name = Logic Control
block.asthosus-12l-02-logic-control.description = Enciende o apaga procesadores de lógica.

block.asthosus-12l-03-hardened-message.name = Hardened Message
block.asthosus-12l-03-hardened-message.description = Almacena mensajes para comunicación entre aliados.

block.asthosus-12l-04-logic-screen.name = Logic Screen
block.asthosus-12l-04-logic-screen.description = Muestra datos de lógica de forma visual.

block.asthosus-12l-05-memory-chip.name = Memory Chip
block.asthosus-12l-05-memory-chip.description = Almacena instrucciones de lógica y valores.


# ============================================
# BLOCKS - Walls (Muros)
# ============================================

block.asthosus-08h-01-ferrinite-wall-small.name = Ferrinite Wall
block.asthosus-08h-01-ferrinite-wall-small.description = Protege las estructuras del daño entrante.

block.asthosus-08h-02-ferrinite-wall-large.name = Large Ferrinite Wall
block.asthosus-08h-02-ferrinite-wall-large.description = Un muro grande hecho de Ferrinite. Protege las estructuras aliadas del daño entrante.

block.asthosus-08h-03-lodestone-wall-small.name = Lodestone Wall
block.asthosus-08h-03-lodestone-wall-small.description = Un muro hecho de Lodestone.

block.asthosus-08h-04-lodestone-wall-large.name = Large Lodestone Wall
block.asthosus-08h-04-lodestone-wall-large.description = Un muro grande hecho de Lodestone.

block.asthosus-08h-05-lithium-wall-small.name = Lithium Wall
block.asthosus-08h-05-lithium-wall-small.description = Un muro hecho de Lithium cargado. Ocasionalmente emite arcos eléctricos que dañan a los enemigos cercanos.

block.asthosus-08h-06-lithium-wall-large.name = Large Lithium Wall
block.asthosus-08h-06-lithium-wall-large.description = Un muro grande hecho de Lithium cargado. Ocasionalmente emite arcos eléctricos que dañan a los enemigos cercanos.

block.asthosus-08h-07-obsidian-wall-small.name = Obsidian Wall
block.asthosus-08h-07-obsidian-wall-small.description = Un muro hecho de Obsidian. Protege las estructuras aliadas del daño. Al ser destruido se rompe en fragmentos dañinos.

block.asthosus-08h-08-obsidian-wall-large.name = Large Obsidian Wall
block.asthosus-08h-08-obsidian-wall-large.description = Un muro grande hecho de Obsidian. Protege las estructuras aliadas del daño. Al ser destruido se rompe en fragmentos dañinos.

block.asthosus-08h-09-barite-wall-small.name = Barite Wall
block.asthosus-08h-09-barite-wall-small.description = Un muro hecho de Barite. Protege las estructuras aliadas del daño. Irradia a los enemigos cercanos.

block.asthosus-08h-10-barite-wall-large.name = Large Barite Wall
block.asthosus-08h-10-barite-wall-large.description = Un muro grande hecho de Barite. Protege las estructuras aliadas del daño. Irradia a los enemigos cercanos.

block.asthosus-08h-11-crosium-wall-small.name = Crosium Wall
block.asthosus-08h-11-crosium-wall-small.description = Un muro hecho de Crosium. Protege las estructuras aliadas del daño. Puede absorber láseres y conducir energía.

block.asthosus-08h-12-crosium-wall-large.name = Large Crosium Wall
block.asthosus-08h-12-crosium-wall-large.description = Un muro grande hecho de Crosium. Protege las estructuras aliadas del daño. Puede absorber láseres y conducir energía.

block.asthosus-08h-13-webbing-wall-small.name = Projector Wall
block.asthosus-08h-13-webbing-wall-small.description = Un muro hecho de Vesmonium capaz de generar un escudo direccional de un solo uso. Al ser destruido explota y paraliza brevemente a los enemigos alcanzados. Blindado contra ataques más débiles.

block.asthosus-08h-14-webbing-wall-large.name = Large Projector Wall
block.asthosus-08h-14-webbing-wall-large.description = Un muro grande hecho de Vesmonium capaz de generar un escudo direccional de un solo uso. Al ser destruido explota y paraliza brevemente a los enemigos alcanzados. Blindado contra ataques más débiles.

block.asthosus-08h-15-draysten-wall-small.name = Draysten Wall
block.asthosus-08h-15-draysten-wall-small.description = Un muro estable hecho de Draysten que ralentiza a los enemigos dentro de su alcance. Requiere y conduce energía.

block.asthosus-08h-16-draysten-wall-large.name = Large Draysten Wall
block.asthosus-08h-16-draysten-wall-large.description = Un muro estable hecho de Draysten que ralentiza a los enemigos dentro de su alcance. Requiere y conduce energía. Ralentiza a los enemigos durante más tiempo y tiene más alcance que un Draysten Wall normal.


# ============================================
# LIQUIDS (Fluidos)
# ============================================

liquid.asthosus-02b-01-pressure.name = Pressure
liquid.asthosus-02b-01-pressure.description = Se usa en innumerables máquinas de Asthosus.

liquid.asthosus-02b-01-q-liquid-silicon-tetrafluoride.name = Silicon Tetrafluoride
liquid.asthosus-02b-01-q-liquid-silicon-tetrafluoride.description = Un gas altamente peligroso usado como refrigerante en torretas y para el refinamiento de recursos.

liquid.asthosus-02b-02-liquid-oasis-water.name = Oasis Water
liquid.asthosus-02b-02-liquid-oasis-water.description = Un líquido que se bombea desde un oasis en un bioma desértico. Se usa como refrigerante o para producción.

liquid.asthosus-02b-03-liquid-purified-oasis-water.name = Purified Oasis Water
liquid.asthosus-02b-03-liquid-purified-oasis-water.description = Oasis Water que ha sido filtrada con un tamiz para eliminar impurezas. Puede usarse en aplicaciones técnicas y como mejor refrigerante.

liquid.asthosus-02b-04-liquid-liquid-barite.name = Liquid Barite
liquid.asthosus-02b-04-liquid-liquid-barite.description = Una variante líquida de Barite que daña todo lo que toca. Puede solidificarse usando un Barite Cooler.

liquid.asthosus-02b-05-liquid-nontragen.name = Nontragen
liquid.asthosus-02b-05-liquid-nontragen.description = Un gas fabricado presurizando Oasis Water y Obsidian. Se usa como refrigerante avanzado y en producción avanzada.

liquid.asthosus-02b-07-arcanoma.name = Arcanoma
liquid.asthosus-02b-07-arcanoma.description = Un líquido aparentemente orgánico que se encuentra en criaturas Arcana. Parece reaccionar a altas temperaturas y consumir calor.

# ============================================
# STATUS EFFECTS (Efectos de estado)
# ============================================

status.asthosus-13m-01-status-rejuvenated.name = Rejuvenated
status.asthosus-13m-01-status-rejuvenated.description = Las abundantes cantidades de minerales del Oasis Water tienen un efecto sobre esta unidad. Reduce la velocidad pero repara lentamente la unidad.

status.asthosus-13m-02-status-radiated.name = Radiated
status.asthosus-13m-02-status-radiated.description = La enorme radiación del Barite cercano afecta a los circuitos de esta unidad. Se destruye lentamente desde dentro.

status.asthosus-13m-03-status-infested.name = Infested
status.asthosus-13m-03-status-infested.description = Minúsculas criaturas biológicas de Barite han infectado esta unidad.

# ============================================
# BLOCKS - Remaining Turrets
# ============================================

block.asthosus-03c-04-skip.name = Skip
block.asthosus-03c-04-skip.description = Dispara ráfagas rápidas de proyectiles a los enemigos.

block.asthosus-03c-05-depuls.name = Depuls
block.asthosus-03c-05-depuls.description = Dispara proyectiles de impacto que empujan a los enemigos.

block.asthosus-03c-06-woge.name = Woge
block.asthosus-03c-06-woge.description = Dispara ondas de choque a los enemigos cercanos.

block.asthosus-03c-07-subtil.name = Subtil
block.asthosus-03c-07-subtil.description = Dispara proyectiles precisos a media distancia.

block.asthosus-03c-08-cavalier.name = Cavalier
block.asthosus-03c-08-cavalier.description = Se carga para disparar tres ráfagas de láser consecutivas que causan alto daño y perforan a los enemigos.

block.asthosus-03c-09-accendret.name = Accendret
block.asthosus-03c-09-accendret.description = Dispara proyectiles teledirigidos, perforantes e inflamables a los enemigos.

block.asthosus-03c-10-fulmination.name = Fulmination
block.asthosus-03c-10-fulmination.description = Dispara agujas de alta velocidad que perforan a los enemigos y se fragmentan en diferentes cosas según la munición utilizada.

block.asthosus-03c-11-syntaxe.name = Syntaxe
block.asthosus-03c-11-syntaxe.description = Se calienta y funde materiales para luego dispararlos a los enemigos, creando charcos corrosivos al impactar.

block.asthosus-03c-12-instauro.name = Instauro
block.asthosus-03c-12-instauro.description = Dispara pernos repetitivos a los enemigos cubriendo así una gran área.

block.asthosus-03c-13-myriad.name = Myriad
block.asthosus-03c-13-myriad.description = Dispara misiles teledirigidos y fragmentarios a los enemigos. Los enemigos alcanzados sufren el estado de choque.

# ============================================
# BLOCKS - More production / utility
# ============================================

block.asthosus-09i-01-lodestone-mixer.name = Lodestone Mixer
block.asthosus-09i-01-lodestone-mixer.description = Mezcla Ferrinite y Hardened Sand para crear Lodestone.

block.asthosus-09i-02-lithium-grinder.name = Lithium Grinder
block.asthosus-09i-02-lithium-grinder.description = Procesa Lignite y Demetite para crear Lithium.

block.asthosus-09i-03-geode-cracker.name = Geode Cracker
block.asthosus-09i-03-geode-cracker.description = Rompe Crystalline Geodes para obtener Obsidian usable.

block.asthosus-09i-04-barite-quern.name = Barite Quern
block.asthosus-09i-04-barite-quern.description = Procesa Irradiated Lumps para crear Barite usable.

block.asthosus-09i-05-slag-cooling-mold.name = Slag Cooling Mold
block.asthosus-09i-05-slag-cooling-mold.description = Enfría slag para crear Obsidian cuando no hay Crystalline Geodes disponibles.

block.asthosus-09i-06-cretite-mixer.name = Cretite Mixer
block.asthosus-09i-06-cretite-mixer.description = Combina Lignite, Lithium y Red Sand para crear Cretite.

