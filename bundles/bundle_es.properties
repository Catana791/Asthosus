#Spanish Bundle - Asthosus
#Traducción al español - Nombres originales mantenidos

#Mod info

#mod.asthosus.name = Asthosus
#mod.asthosus.author = Catser
#mod.asthosus.description = Un mod que añade un nuevo planeta, Asthosus, al juego.\n\nAsthosus es un planeta desértico. Un páramo lleno de peligros.\nTiene una campaña completamente jugable con 11 sectores de campaña y 21 opcionales.\n\nAdemás de estos 32 sectores, Asthosus contiene más de 180 piezas de contenido único,\nincluyendo bloques, líquidos, objetos, unidades y efectos de estado.\nEste número no incluye unidades internas ni bloques/tiles de entorno.\n\nIntenté reutilizar casi nada de contenido vanilla y en su lugar\nllenar el mod con cosas nuevas y (esperemos) emocionantes.\n\n¡El mod incluye su propia música personalizada, hecha por ThePythonGuy3!\n\nSi encuentras algún problema o quieres contarme cualquier otra cosa,\nno dudes en unirte al servidor de Discord de Asthosus.\nLo mismo aplica si necesitas ayuda con este mod.\n\nAsthosus está disponible en los siguientes idiomas:\n- Inglés\n- Alemán\n- Indonesio\n- Ruso\n- Ucraniano\n- Chino tradicional\n- Chino simplificado\n- Español\n\n¡Disfruta!
#mod.asthosus.subtitle = ¡Ahora con un 68.9% más de barita!

#Planets

planet.asthosus-asthosus.name = Asthosus
planet.asthosus-asthosus.description = Un planeta desértico, lleno de peligros pero también de posibilidades. ¡Buena suerte!

planet.asthosus-trecara.name = [red]Trecara - ¡En desarrollo!
planet.asthosus-trecara.description = Luna de Asthosus, un cuerpo estelar frondoso que contiene abundancia de agua y fauna. Los minerales son extremadamente raros aquí, así que usa lo que tengas para conquistar este planeta.
planet.asthosus-trecara.details = Nadie sabe por qué la catástrofe que golpeó a Asthosus y lo convirtió en un planeta desértico ocurrió en primer lugar. Trecara estaba destinada a servir como protección contra tal desastre...

#Campaign Objectives

genesis.ferrinite = Bienvenido a Asthosus.\n\nInvestiga y construye 4 \n[accent]Ferrinite Mining Units[] para empezar.\n\nLas Ferrinite Mining Units se pueden colocar \nenfrentando las paredes grises claras.\n\nLas paredes grises oscuras están envejecidas y no se pueden minar \ncon la Ferrinite Mining Unit.\n\nUsa [accent]Ferrinite Pipelines[] para conectar las \nMining Units a tu núcleo.
genesis.demetite = Investiga la [accent]Demetite Mining Unit[] \ny construye 4 de ellas para continuar.\n\nLas Demetite Mining Units se pueden colocar \nenfrentando las paredes arenosas de color claro.\n\nLas paredes arenosas de color más oscuro \nestán envejecidas y no se pueden minar \ncon las Demetite Mining Units.\n\nConecta las [accent]Demetite Mining Units[] a \ntu núcleo usando [accent]Ferrinite Pipelines[].
genesis.walls = ¡Enemigos en camino!\n\n\ue803 Muévete hacia la zona de aterrizaje enemiga y \ue803\ncoloca algunas paredes allí para continuar!
genesis.catapults = Las paredes no detendrán al enemigo \npor sí solas.\n\nInvestiga y construye 3 [accent]Catapults[].\n\nProporciona munición en forma de \nFerrinite o Demetite a \nlas [accent]Catapults[] usando [accent]Ferrinite Pipelines[].

objective.read = [accent]¡Lee las instrucciones de tu núcleo con atención!

ignition.power = La energía es vital en Asthosus.\n\nInvestiga el [accent]Friction Quarry[] del árbol tecnológico \ue875\ny construye tres de ellos en las ubicaciones designadas.
ignition.generator = Investiga el [accent]Ignition Generator[] del árbol tecnológico \ue875.\nConstruye uno y suminístrale [accent]Lignite[] de tus [accent]Friction Quarries[].
ignition.connect = Investiga el [accent]Ferrinite Wire[] de tu árbol tecnológico \ue875 y\nconstruye algunos para conectar directamente el [accent]Ignition Generator \nal [accent]Restoration Projector[] junto a tu núcleo.
ignition.enemies = ¡Los enemigos se han dado cuenta de tu presencia aquí! Defiende este sector.\nUsa esta oportunidad para familiarizarte con el [accent]\ue810 sistema de energía de Asthosus[].
ignition.alert = [red]¡Enemigos en camino!\n¡Defiende este sector!

lattice.lodestone = [accent]Lodestone[] es un recurso vital en Asthosus.\n\nInvestiga y coloca un [accent]Lodestone Mixer[].\n\nNecesitas minar algo de [accent]Hardened Sand[] del bioma desértico \npara que el mezclador esté disponible para investigación.
lattice.produce = Suministra al [accent]Lodestone Mixer[] Ferrinite \ny Hardened Sand para que produzca [accent]Lodestone[].\n\nEl Hardened Sand se puede minar de \nlos azulejos de Hardened Sand en los biomas desérticos. 
lattice.enemies = ¡Enemigos en camino! Utiliza la nueva tecnología para defender el núcleo y captu—

fulge.lithium = [accent]Lithium[] es esencial para muchos procesos.\nInvestiga y construye el [accent]Lithium Grinder[].
fulge.create = Suministra al [accent]Lithium Grinder[] Lignite y Demetite \npara que cree [accent]Lithium[].
fulge.enemies = ¡Continúa produciendo Lithium e investiga su tecnología!\n\nLos enemigos se han dado cuenta de tu presencia aquí, ¡defiéndete!
fulge.incoming = [red]¡Enemigos en camino!

immist.ground = Las torretas son inmóviles e inadecuadas para el asalto. Se requieren unidades.\n\nInvestiga el [accent]Ground Assembly Bay[] antes de construir uno.
immist.shiv = Las unidades requieren varias piezas para funcionar correctamente.\nEstas se pueden fabricar dentro de [accent]Component Assemblers[].\n\nCrea los materiales requeridos para 6 Shivs, luego continúa.
immist.command = Se requiere el [accent]Modo de Comando[] para dar órdenes a las unidades. \n\nMantén [accent]L-shift[] junto con clic izquierdo y arrastra a través de una selección para seleccionar un grupo de unidades.\nMantén [accent]L-shift[] y haz clic derecho para ordenarles ir a una ubicación.\n\n[accent]Shift+G[] selecciona todas las unidades. [accent]Shift+H[] selecciona todas las fábricas de unidades.\n\nEn móvil, presiona el botón de comando para entrar en modo comando\nluego mantén un dedo y arrastra para seleccionar un grupo de unidades.\nToca en una ubicación para ordenarles.\n\nÚsalos a tu favor, estableciendo puntos de reunión estratégicos para las tropas.
immist.constituent = Las unidades de nivel superior solo se pueden crear cuando un [accent]Assembler Constituent[] se coloca adyacente a tu Assembly Bay.\n\nLos niveles de unidades requieren todos los prerrequisitos, lo que significa que una unidad de nivel 3 \nrequiere los Constituents Básico y Avanzado, no uno u otro.\n\nLas unidades de nivel superior pueden requerir componentes más avanzados.\n\nLos [accent]Component Assemblers[] de nivel superior pueden construir estas piezas.
immist.skills = Ahora sabes cómo crear unidades y sus componentes.\nAdemás de cómo construir unidades más fuertes.\n\nUsa estas habilidades para derrotar el puesto avanzado enemigo.\nRecuerda, un ejército nunca puede ser demasiado grande.

igneouspeaks.obsidian = [accent]Obsidian[] es muy útil para construcciones avanzadas.\n\nSolo se puede minar usando un [accent]Large Friction Quarry[] o una cantera de nivel superior.\n\nInvestiga el [accent]Large Friction Quarry[] del árbol tecnológico \ue875 y \ncoloca algunos en los minerales oscuros que se encuentran en los biomas de obsidiana.\n\nEstos taladros solo pueden minar [accent]Crystalline Geodes[] de esos minerales.\n\nEsas geodas deben procesarse en un [accent]Geode Cracker[] para obtener [accent]Obsidian[] usable.

detrimentvalley.barite = [accent]Barite[] solo se puede minar usando un [accent]Abrasion Quarry[] o superior.\n\nMina Barite de los azulejos White Barite en el bioma radiactivo.\n\nLos [accent]Irradiated Lumps[] caídos deben procesarse en \nBarite usable usando primero un [accent]Barite Quern[].
detrimentvalley.creatures = Asthosus es el hogar de una familia de criaturas.\n\nParecen ser orgánicas.\n\nEstas criaturas emergerán de colmenas.\n\nLas colmenas se pueden encontrar dentro de su propio bioma. 
detrimentvalley.creatureslocate = [accent]Criaturas Barite localizándote en [lightgray]{0}

omega.attackstart = [red]Oleadas enemigas[] comenzando en [accent]10 minutos.\n[red]Producción de unidades enemigas []comenzando en [accent]15 minutos[].
omega.basebusy = [red]El enemigo[] está ocupado.\nLa siguiente oleada se retrasa.\n[accent]¡Usa este tiempo bien!\n\n[]⚠ ¡Las bahías de unidades enemigas no se ven afectadas! ⚠
omega.baseback = [red]El enemigo[] ya no está ocupado. \nEl tiempo entre oleadas se acorta de nuevo.\n[accent]¡Ten cuidado!
omega.approaching = [red]⚠ Se acerca la destrucción inminente ⚠[]
omega.traps = ¡Las [accent]Explosive Traps[] han sido [red]destruidas![]\n\n¡Tu [accent]infraestructura[] ha sufrido [red]daños considerables![]

